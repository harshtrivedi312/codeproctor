# Stricter, optional profile for NFR-04 (OWASP ASVS level 2). Same format as baseline.conf.
# Used with: zap-baseline.py -c baseline-asvs.conf ... (a FAIL gives a non-zero exit code of the scan itself).
# These are findings the docs care about even though they are Medium or Low risk in ZAP:
# secure cookies for the refresh token (FR-104), no tokens or keys in URLs (CLAUDE.md, ADR 0013 5.1),
# no PII or debug output in responses, and the browser hardening headers (ADR 0013 CSP).
10010	FAIL	(Cookie No HttpOnly Flag)
10011	FAIL	(Cookie Without Secure Flag)
10054	FAIL	(Cookie without SameSite Attribute)
10024	FAIL	(Information Disclosure - Sensitive Information in URL)
10062	FAIL	(PII Disclosure)
10023	FAIL	(Information Disclosure - Debug Error Messages)
10037	FAIL	(Server Leaks Information via "X-Powered-By" HTTP Response Header Field(s))
10035	FAIL	(Strict-Transport-Security Header)
10038	FAIL	(Content Security Policy (CSP) Header Not Set)
10020	FAIL	(Anti-clickjacking Header)
10021	FAIL	(X-Content-Type-Options Header Missing)
10055	FAIL	(CSP: Wildcard Directive)
10098	FAIL	(Cross-Domain Misconfiguration)
10063	FAIL	(Permissions Policy Header Not Set)
10109	INFO	(Modern Web Application)
10027	INFO	(Information Disclosure - Suspicious Comments)
10049	INFO	(Storable and Cacheable Content)
10050	INFO	(Retrieved from Cache)
10094	INFO	(Base64 Disclosure)
