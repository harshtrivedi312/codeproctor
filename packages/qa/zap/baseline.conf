# ZAP baseline rules for TC-093 (NFR-04). Format: <rule id><TAB><INFO|IGNORE|WARN|FAIL><TAB>(<name>).
# Used with: zap-baseline.py -c baseline.conf  (README in this folder).
#
# TC-093 passes when the scan finds no High alert (ZAP risk code 3) and actually reached the target.
# evaluate.mjs decides that from report.json, so no rule is set to FAIL here: a FAIL would stop the scan
# step with its own exit code before the report is evaluated. Every rule not listed stays at the ZAP
# default (WARN) and is counted in the report.
#
# Only purely informational rules are lowered to INFO to keep the summary readable. Nothing is IGNOREd:
# an ignore needs a written reason and an owner, added in a PR with the finding it hides.
10109	INFO	(Modern Web Application)
10027	INFO	(Information Disclosure - Suspicious Comments)
10049	INFO	(Storable and Cacheable Content)
10050	INFO	(Retrieved from Cache)
10094	INFO	(Base64 Disclosure)
