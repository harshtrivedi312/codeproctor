[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeproctor-worker"
version = "0.0.0"
description = "CodeProctor analysis worker: keystroke analytics, code similarity, voice activity, risk score (FR-802..FR-805)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Real Silero VAD backend only (ADR 0001 section 12). Tests use a fake backend.
vad = ["onnxruntime>=1.18"]
# Face matching (FR-403): MediaPipe (Apache 2.0) detection and landmarks, onnxruntime for AuraFace
# glintr100.onnx, Pillow to decode images. Model files are never bundled or downloaded here.
face = ["mediapipe==0.10.21", "onnxruntime>=1.18", "pillow>=10"]
dev = ["pillow>=10", "pytest>=8", "pytest-cov>=5", "httpx>=0.27", "mypy>=1.10", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--cov=worker --cov-report=term-missing"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src:tests"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "mediapipe", "mediapipe.*", "PIL", "PIL.*"]
ignore_missing_imports = true

[tool.coverage.run]
# The MediaPipe adapter needs the real library and model file (opt-in manual test only).
omit = ["*/worker/face/detector.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "E501", "ANN"]
