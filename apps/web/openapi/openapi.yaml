          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  responses:
    Forbidden:
      description: The role is not allowed to call this route (FR-103)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  parameters:
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string }
  schemas:
    StaffRole:
      # Must match UserRole in prisma/schema.prisma.
      type: string
      enum: [SUPER_ADMIN, RECRUITER, AUTHOR, REVIEWER]
    AuthUser:
      type: object
      required: [id, email, name, role, orgName, totpEnabled]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        orgName: { type: string }
        # Backend adds this to AuthUserDto (login, 2fa/verify, enroll-confirm, refresh).
        totpEnabled: { type: boolean }
    AuthSession:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/AuthUser' }
    ChallengeRequest:
      type: object
      required: [challengeToken]
      properties:
        challengeToken: { type: string }
    LoginResult:
      type: object
      required: [status]
      properties:
        status:
          {
            type: string,
            enum: [authenticated, two_factor_required, two_factor_enrollment_required],
          }
        session: { $ref: '#/components/schemas/AuthSession' }
        challengeToken: { type: string }
    QuestionType:
      type: string
      enum: [CODING, MCQ, SHORT_ANSWER]
    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
    Limits:
      type: object
      required: [cpuMs, wallMs, memoryKb]
      properties:
        cpuMs: { type: integer, minimum: 100, maximum: 10000 }
        wallMs: { type: integer, minimum: 100, maximum: 20000, description: Not below cpuMs }
        memoryKb: { type: integer, minimum: 16384, maximum: 524288 }
    TestCase:
      type: object
      description: >-
        A test slot. For a reader without question:update a HIDDEN case carries only id, position,
        isHidden and weight: the input and expectedOutput keys are absent, not null.
      required: [id, position, isHidden, weight]
      properties:
        id: { type: string }
        position: { type: integer, minimum: 0 }
        isHidden: { type: boolean }
        weight: { type: number }
        input: { type: string }
        expectedOutput: { type: string }
    TestCaseInput:
      type: object
      required: [input, expectedOutput]
      properties:
        input: { type: string, maxLength: 100000 }
        expectedOutput: { type: string, maxLength: 100000 }
        isHidden: { type: boolean, default: true }
        weight:
          {
            type: number,
            minimum: 0.01,
            maximum: 9999.99,
            default: 1,
            description: At most 2 decimals,
          }
        position:
          { type: integer, minimum: 0, maximum: 10000, description: Default after the last slot }
    TestCasePatch:
      type: object
      properties:
        input: { type: string, maxLength: 100000 }
        expectedOutput: { type: string, maxLength: 100000 }
        isHidden: { type: boolean }
        weight: { type: number, minimum: 0.01, maximum: 9999.99 }
        position: { type: integer, minimum: 0, maximum: 10000 }
    McqOption:
      type: object
      required: [id, text]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{1,32}$' }
        text: { type: string, minLength: 1, maxLength: 1000 }
    McqAnswerSpec:
      type: object
      description: MCQ answer spec (the question type says which shape applies). 2 to 10 options.
      required: [options, correctOptionIds, multiple]
      properties:
        options:
          {
            type: array,
            minItems: 2,
            maxItems: 10,
            items: { $ref: '#/components/schemas/McqOption' },
          }
        correctOptionIds: { type: array, minItems: 1, maxItems: 10, items: { type: string } }
        multiple: { type: boolean }
    ShortAnswerSpec:
      type: object
      description: SHORT_ANSWER answer spec (D-23).
      required: [canonical, acceptedVariants]
      properties:
        canonical: { type: string, minLength: 1, maxLength: 500 }
        acceptedVariants:
          { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 500 } }
    AnswerSpec:
      oneOf:
        - $ref: '#/components/schemas/McqAnswerSpec'
        - $ref: '#/components/schemas/ShortAnswerSpec'
    QuestionVersionRef:
      type: object
      required: [id, version, isPublished, title, difficulty, validatedAt, createdAt]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        isPublished: { type: boolean }
        title: { type: string }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        validatedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    QuestionSummary:
      type: object
      required: [id, slug, type, tags, isArchived, createdAt, published, latest]
      properties:
        id: { type: string }
        slug: { type: string }
        type: { $ref: '#/components/schemas/QuestionType' }
        tags: { type: array, items: { type: string } }
        isArchived: { type: boolean }
        createdAt: { type: string, format: date-time }
        published:
          nullable: true
          description: The published version tests use; null until the first publish
          allOf:
            - $ref: '#/components/schemas/QuestionVersionRef'
        latest:
          description: Highest version number (maybe a draft); for a reader without question:update the highest PUBLISHED version
          allOf:
            - $ref: '#/components/schemas/QuestionVersionRef'
    QuestionList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/QuestionSummary' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    ValidationOutcome:
      type: string
      enum: [pass, wrong_answer, runtime_error, compile_error, limit_exceeded]
    ValidationResult:
      type: object
      required: [variantId, variantLabel, testCaseId, position, language, outcome]
      properties:
        variantId: { type: string, nullable: true, description: Null for the base statement }
        variantLabel: { type: string }
        testCaseId: { type: string }
        position: { type: integer, minimum: 0 }
        language: { $ref: '#/components/schemas/Language' }
        outcome: { $ref: '#/components/schemas/ValidationOutcome' }
        message: { type: string }
    ValidationReport:
      type: object
      description: >-
        Stored in the version's validationReport. The API defines `passed` and `revision` (the
        content revision the run validated; publish ignores a report of another revision). The other
        members are a WEB-ONLY placeholder [BE-04c].
      required: [passed, revision]
      additionalProperties: true
      properties:
        passed: { type: boolean }
        revision: { type: string }
        finishedAt: { type: string, format: date-time }
        results: { type: array, items: { $ref: '#/components/schemas/ValidationResult' } }
    ValidationJobRef:
      type: object
      required: [jobId, revision]
      properties:
        jobId: { type: string }
        revision: { type: string, description: The content revision the job validates }
    ValidationJob:
      type: object
      required: [jobId, revision, status]
      properties:
        jobId: { type: string }
        revision:
          {
            type: string,
            description: The content revision the job validated; a report for another revision must never be shown as current,
          }
        status: { type: string, enum: [queued, running, done, failed] }
        report: { $ref: '#/components/schemas/ValidationReport' }
        error: { type: string }
    QuestionVersion:
      description: The full version a caller with question:update gets
      allOf:
        - $ref: '#/components/schemas/QuestionVersionRef'
        - type: object
          required:
            [
              statementMd,
              allowedLanguages,
              limits,
              starterCode,
              referenceSolution,
              answerSpec,
              validationReport,
              revision,
              testCases,
            ]
          properties:
            statementMd: { type: string, maxLength: 50000 }
            allowedLanguages: { type: array, items: { $ref: '#/components/schemas/Language' } }
            limits: { $ref: '#/components/schemas/Limits' }
            starterCode: { type: object, additionalProperties: { type: string } }
            referenceSolution: { type: object, additionalProperties: { type: string } }
            answerSpec:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AnswerSpec'
            validationReport:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ValidationReport'
            revision:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: >-
                Opaque SHA-256 of the version content and test cases (question:update only). Send it
                back as expectedRevision; it changes with every content or test-case change.
            testCases: { type: array, items: { $ref: '#/components/schemas/TestCase' } }
    QuestionVersionRead:
      type: object
      additionalProperties: false
      description: >-
        What a reader without question:update gets of a version: an allowlist. No revision,
        referenceSolution, answerSpec or validationReport, and hidden test cases without input and
        expectedOutput.
      required:
        [
          id,
          version,
          isPublished,
          title,
          difficulty,
          validatedAt,
          createdAt,
          statementMd,
          allowedLanguages,
          limits,
          starterCode,
          testCases,
        ]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        isPublished: { type: boolean }
        title: { type: string }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        validatedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        statementMd: { type: string }
        allowedLanguages: { type: array, items: { $ref: '#/components/schemas/Language' } }
        limits: { $ref: '#/components/schemas/Limits' }
        starterCode: { type: object, additionalProperties: { type: string } }
        testCases: { type: array, items: { $ref: '#/components/schemas/TestCase' } }
    QuestionDetail:
      description: A question with one full version (question:update)
      allOf:
        - $ref: '#/components/schemas/QuestionSummary'
        - type: object
          required: [versions, version, createdNewVersion]
          properties:
            versions:
              {
                type: array,
                items: { $ref: '#/components/schemas/QuestionVersionRef' },
                description: Oldest first,
              }
            version: { $ref: '#/components/schemas/QuestionVersion' }
            createdNewVersion:
              type: boolean
              description: true when this PATCH created a new version because the latest was published
    QuestionDetailRedacted:
      type: object
      additionalProperties: false
      description: The detail a reader without question:update gets (an allowlist, DL-32, BE-04a staff-view.ts)
      required:
        [
          id,
          slug,
          type,
          tags,
          isArchived,
          createdAt,
          published,
          latest,
          versions,
          version,
          createdNewVersion,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        type: { $ref: '#/components/schemas/QuestionType' }
        tags: { type: array, items: { type: string } }
        isArchived: { type: boolean }
        createdAt: { type: string, format: date-time }
        published:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/QuestionVersionRef'
        latest:
          allOf:
            - $ref: '#/components/schemas/QuestionVersionRef'
        versions: { type: array, items: { $ref: '#/components/schemas/QuestionVersionRef' } }
        version: { $ref: '#/components/schemas/QuestionVersionRead' }
        createdNewVersion: { type: boolean }
    CreateQuestion:
      type: object
      required: [title, statementMd, difficulty]
      properties:
        type: { $ref: '#/components/schemas/QuestionType' }
        slug:
          {
            type: string,
            maxLength: 80,
            description: Unique per organization; generated from the title when omitted,
          }
        title: { type: string, minLength: 1, maxLength: 200 }
        statementMd: { type: string, minLength: 1, maxLength: 50000 }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        tags: { type: array, maxItems: 20, items: { type: string } }
        allowedLanguages: { type: array, items: { $ref: '#/components/schemas/Language' } }
        limits: { $ref: '#/components/schemas/Limits' }
        starterCode: { type: object, additionalProperties: { type: string } }
        referenceSolution: { type: object, additionalProperties: { type: string } }
        answerSpec: { $ref: '#/components/schemas/AnswerSpec' }
        testCases:
          { type: array, maxItems: 100, items: { $ref: '#/components/schemas/TestCaseInput' } }
    UpdateQuestion:
      type: object
      description: Every field is optional, at least one is needed. Test cases have their own routes.
      properties:
        expectedRevision: { type: string, pattern: '^[0-9a-f]{64}$' }
        title: { type: string, minLength: 1, maxLength: 200 }
        statementMd: { type: string, minLength: 1, maxLength: 50000 }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        tags: { type: array, maxItems: 20, items: { type: string } }
        allowedLanguages: { type: array, items: { $ref: '#/components/schemas/Language' } }
        limits: { $ref: '#/components/schemas/Limits' }
        starterCode: { type: object, additionalProperties: { type: string } }
        referenceSolution: { type: object, additionalProperties: { type: string } }
        answerSpec: { $ref: '#/components/schemas/AnswerSpec' }
    PublishRequest:
      type: object
      properties:
        expectedRevision: { type: string, pattern: '^[0-9a-f]{64}$' }
    Problem:
      type: object
      description: >-
        RFC 7807 problem body of the question routes. 409 and 422 carry detail and errors[] only: no
        machine code, the caller tells cases apart by endpoint and status.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors: { type: array, items: { type: string } }
    VariantOverride:
      type: object
      required: [testCaseId, input, expectedOutput]
      properties:
        testCaseId: { type: string }
        input: { type: string }
        expectedOutput: { type: string }
    Variant:
      type: object
      description: WEB-ONLY placeholder [BE-04b]. Explicit params per variant (ADR 0007), no parameter schema.
      required: [id, label, params, active, overrides]
      properties:
        id: { type: string }
        label: { type: string }
        params:
          type: object
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
        active: { type: boolean }
        overrides: { type: array, items: { $ref: '#/components/schemas/VariantOverride' } }
    VariantList:
      type: object
      required: [variants]
      properties:
        variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
    AiReferencePolicy:
      type: object
      required: [refreshDays, minAssistants]
      description: Org settings aiReferences.* (ADR 0005 AI-4, AI-5), read-only here because Authors cannot read org settings
      properties:
        refreshDays: { type: integer, minimum: 1 }
        minAssistants: { type: integer, minimum: 0 }
    AiReferenceInput:
      type: object
      required: [assistant, modelLabel, language, solutionCode, collectedAt]
      properties:
        assistant: { type: string, minLength: 1, maxLength: 80 }
        modelLabel: { type: string, minLength: 1, maxLength: 80 }
        language: { $ref: '#/components/schemas/Language' }
        solutionCode: { type: string, minLength: 1, maxLength: 100000 }
        promptText: { type: string, maxLength: 20000 }
        collectedAt: { type: string, format: date-time }
        variantId: { type: string, nullable: true, description: Null means the base statement }
    AiReference:
      allOf:
        - $ref: '#/components/schemas/AiReferenceInput'
        - type: object
          required: [id, collectedByName, supersededAt]
          properties:
            id: { type: string }
            collectedByName: { type: string }
            supersededAt: { type: string, format: date-time, nullable: true }
    AiReferenceList:
      type: object
      required: [items, policy]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AiReference' } }
        policy: { $ref: '#/components/schemas/AiReferencePolicy' }
    PrefillRequest:
      type: object
      required: [language, params, referenceSolution, slots]
      properties:
        language: { $ref: '#/components/schemas/Language' }
        params: { type: object, additionalProperties: true }
        referenceSolution:
          {
            type: string,
            maxLength: 100000,
            description: The template as edited (may be unsaved); the API renders it with params,
          }
        slots:
          type: array
          items:
            type: object
            required: [testCaseId, input]
            properties:
              testCaseId: { type: string }
              input:
                {
                  type: string,
                  description: The input that applies to this variant,
                  override or default,
                }
    PrefillResponse:
      type: object
      required: [proposals]
      properties:
        proposals:
          type: array
          items:
            type: object
            required: [testCaseId]
            properties:
              testCaseId: { type: string }
              expectedOutput: { type: string }
              error:
                {
                  type: string,
                  description: Why no output could be produced (runtime error,
                  limit),
                }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ProblemDetails:
      # RFC 7807 problem JSON from the API's global filter (PR #26). `code` appears only on coded errors.
      type: object
      required: [type, title, status, instance, traceId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors: { type: array, items: { type: string } }
        code: { type: string, enum: [REAUTH_FAILED, TWO_FACTOR_REQUIRED_FOR_ROLE] }
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }
    Language:
      # Must match codeLanguageSchema in packages/shared/src/code-run.ts.
      type: string
      enum: [python, javascript, java]
    DraftRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [code, mcq] }
        language: { $ref: '#/components/schemas/Language' }
        code: { type: string, maxLength: 100000 } # MAX_SOURCE_CODE_LENGTH in packages/shared
        selectedOptionId: { type: string, nullable: true }
    RunRequest:
      type: object
      required: [language, code]
      properties:
        language: { $ref: '#/components/schemas/Language' }
        code: { type: string, maxLength: 100000 } # MAX_SOURCE_CODE_LENGTH in packages/shared
    SampleTestResult:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [passed, failed] }
        input: { type: string }
        expectedOutput: { type: string }
        actualOutput: { type: string }
        durationMs: { type: integer }
    RunResult:
      type: object
      required: [outcome, tests, stdout, stderr]
      properties:
        outcome:
          type: string
          enum: [completed, compile_error, runtime_error, time_limit_exceeded]
        tests:
          type: array
          items: { $ref: '#/components/schemas/SampleTestResult' }
        stdout: { type: string }
        stderr: { type: string }
    SampleTest:
      type: object
      required: [id, name, input, expectedOutput]
      properties:
        id: { type: string }
        name: { type: string }
        input: { type: string }
        expectedOutput: { type: string }
    Question:
      type: object
      required: [id, type, title, points, statementMarkdown]
      properties:
        id: { type: string }
        type: { type: string, enum: [coding, mcq] }
        title: { type: string }
        points: { type: integer }
        statementMarkdown: { type: string }
        languages:
          type: array
          items: { $ref: '#/components/schemas/Language' }
        starterCode:
          type: object
          description: Starter code keyed by language
          additionalProperties: { type: string }
        sampleTests:
          type: array
          items: { $ref: '#/components/schemas/SampleTest' }
        options:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
    CandidateSession:
      type: object
      required: [testTitle, testDeadlineAt, section, questions]
      properties:
        testTitle: { type: string }
        testDeadlineAt: { type: string, format: date-time }
        section:
          type: object
          required: [id, position, totalSections, title, deadlineAt]
          properties:
            id: { type: string }
            position: { type: integer }
            totalSections: { type: integer }
            title: { type: string }
            deadlineAt: { type: string, format: date-time, nullable: true }
        questions:
          type: array
          description: Questions of the open section only
          items: { $ref: '#/components/schemas/Question' }
    StaffUser:
      type: object
      required: [id, email, name, role, status]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        status: { type: string, enum: [invited, active, deactivated] }
        lastLoginAt: { type: string, format: date-time, nullable: true }
    EventSeverity:
      # Must match SEVERITIES in packages/shared/src/events.ts.
      type: string
      enum: [LOW, MEDIUM, HIGH]
    RiskSettings:
      type: object
      description: FR-804 and ADR 0005 section 2. Weights are keyed by event type.
      required: [severityPoints, capPerType, bandMinScore, weights]
      properties:
        severityPoints:
          type: object
          required: [LOW, MEDIUM, HIGH]
          properties:
            LOW: { type: integer, minimum: 0, maximum: 100 }
            MEDIUM: { type: integer, minimum: 0, maximum: 100 }
            HIGH: { type: integer, minimum: 0, maximum: 100 }
        capPerType: { type: integer, minimum: 1, maximum: 20 }
        bandMinScore:
          type: object
          required: [MEDIUM, HIGH]
          properties:
            MEDIUM: { type: integer, minimum: 1, maximum: 99 }
            HIGH: { type: integer, minimum: 2, maximum: 100 }
        weights:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 5 }
    OrgSettings:
      type: object
      required: [retentionDays, erasure, risk, consentDeclineContact]
      properties:
        retentionDays: { type: integer, minimum: 7, maximum: 730 }
        erasure:
          type: object
          required: [holdWhileReviewOrAppealOpen]
          properties:
            holdWhileReviewOrAppealOpen: { type: boolean }
        risk: { $ref: '#/components/schemas/RiskSettings' }
        consentDeclineContact: { type: string, maxLength: 300 }
    OrgSettingsPatch:
      type: object
      properties:
        retentionDays: { type: integer, minimum: 7, maximum: 730 }
        erasure:
          type: object
          properties:
            holdWhileReviewOrAppealOpen: { type: boolean }
        risk: { $ref: '#/components/schemas/RiskSettings' }
        consentDeclineContact: { type: string, maxLength: 300 }
    ConsentText:
      type: object
      required: [id, version, bodyMd, createdAt, legalApprovedAt, isCurrent]
      properties:
        id: { type: string }
        version: { type: string }
        bodyMd: { type: string }
        createdAt: { type: string, format: date-time }
        legalApprovedAt: { type: string, format: date-time, nullable: true }
        legalApprovedBy: { type: string, nullable: true }
        isCurrent: { type: boolean }
    CandidateSummary:
      type: object
      required: [id, name, email, erasure]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        lastSessionAt: { type: string, format: date-time, nullable: true }
        erasure:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [none, waiting, queued, erased]
              description: waiting = held while a review or appeal is open (D-19)
            requestedAt: { type: string, format: date-time, nullable: true }
            waitingFor: { type: string, enum: [review, appeal], nullable: true }
