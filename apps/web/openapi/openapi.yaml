openapi: 3.0.3
info:
  title: CodeProctor API (frontend mock contract)
  version: 0.0.0-mock
  description: |
    Hand-written, minimal contract for the endpoints that apps/web calls through MSW mocks.
    There is no backend OpenAPI spec yet. When the NestJS API publishes its generated spec, replace
    this file with it, re-run `pnpm --filter @codeproctor/web gen:api`, and delete the matching
    mocks in src/mocks. Paths and shapes below are placeholders, not the final API.
servers:
  - url: http://localhost:4000
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /v1/time:
    get:
      operationId: getServerTime
      summary: Server clock, used to seed client countdown timers (FR-505)
      responses:
        '200':
          description: Current server time
          content:
            application/json:
              schema:
                type: object
                required: [serverNow]
                properties:
                  serverNow: { type: string, format: date-time }
  /v1/candidate/session:
    get:
      operationId: getCandidateSession
      summary: The candidate's running session with the open section and its questions (FR-301, FR-505)
      responses:
        '200':
          description: Session snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateSession'
  /v1/candidate/questions/{questionId}/draft:
    put:
      operationId: saveDraft
      summary: Autosave a code draft or an answer (FR-504)
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRequest'
      responses:
        '200':
          description: Draft stored
          content:
            application/json:
              schema:
                type: object
                required: [savedAt]
                properties:
                  savedAt: { type: string, format: date-time }
  /v1/candidate/questions/{questionId}/run:
    post:
      operationId: runSampleTests
      summary: Run code against the sample tests (FR-502). One run per 5 seconds.
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '200':
          description: Sample test results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
        '429':
          description: Too many runs
          content:
            application/json:
              schema:
                type: object
                required: [retryAfterSeconds]
                properties:
                  retryAfterSeconds: { type: integer }
  /v1/candidate/sections/{sectionId}/finish:
    post:
      operationId: finishSection
      summary: 'Finish the open section. Final, it cannot be reopened (ADR 0002 S-1).'
      parameters:
        - name: sectionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Section closed
          content:
            application/json:
              schema:
                type: object
                required: [finishedAt]
                properties:
                  finishedAt: { type: string, format: date-time }
                  nextSectionId: { type: string, nullable: true }
  /v1/auth/login:
    post:
      operationId: login
      summary: Staff password login (FR-101). Placeholder path, see fsd.md section 4 (/auth/login).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 1024 }
      responses:
        '200':
          description: Signed in, or a second step is needed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '423':
          description: Account locked for 15 minutes after 5 failed attempts (FR-101)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockedError'
  /v1/auth/2fa/enroll/start:
    post:
      operationId: startTwoFactorEnrollment
      summary: Begin forced TOTP enrollment (FR-102). Needs the challenge token from login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      responses:
        '200':
          description: Secret and otpauth URI for the QR code
          content:
            application/json:
              schema:
                type: object
                required: [manualKey, otpauthUri]
                properties:
                  manualKey: { type: string }
                  otpauthUri: { type: string }
        '401':
          description: Challenge expired, sign in again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/2fa/enroll/confirm:
    post:
      operationId: confirmTwoFactorEnrollment
      summary: Confirm enrollment with a first code; returns the one-time recovery codes (ADR 0003 section 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code: { type: string, maxLength: 6 }
      responses:
        '200':
          description: Enrolled and signed in
          content:
            application/json:
              schema:
                type: object
                required: [session, recoveryCodes]
                properties:
                  session: { $ref: '#/components/schemas/AuthSession' }
                  recoveryCodes:
                    type: array
                    items: { type: string }
        '400':
          description: Wrong code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Challenge expired, sign in again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/2fa/verify:
    post:
      operationId: verifyTwoFactor
      summary: Complete login with a 6-digit TOTP code or a recovery code (FR-102, ADR 0003 section 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: Wrong code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Challenge expired, sign in again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh cookie and return a new access token (FR-104). Cookie is httpOnly.
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: No valid refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh-token family and clear the cookie
      responses:
        '204':
          description: Signed out
  /v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Request a reset link. Always 202 with the same body (FR-107, D-22).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        '202':
          description: Accepted, whether or not the account exists
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a password with a single-use reset or invite token (FR-107, ADR 0003 section 4). Never signs in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, maxLength: 256 }
                newPassword: { type: string, maxLength: 1024 }
      responses:
        '204':
          description: Password set, token consumed
        '400':
          description: Token invalid, expired or already used (one message for all three)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  parameters:
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string }
  schemas:
    StaffRole:
      # Must match UserRole in prisma/schema.prisma.
      type: string
      enum: [SUPER_ADMIN, RECRUITER, AUTHOR, REVIEWER]
    AuthUser:
      type: object
      required: [id, email, name, role, orgName]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        orgName: { type: string }
    AuthSession:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/AuthUser' }
    ChallengeRequest:
      type: object
      required: [challengeToken]
      properties:
        challengeToken: { type: string }
    LoginResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [authenticated, two_factor_required, two_factor_enrollment_required] }
        session: { $ref: '#/components/schemas/AuthSession' }
        challengeToken: { type: string }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    LockedError:
      type: object
      required: [code, message, lockedUntil]
      properties:
        code: { type: string, enum: [account_locked] }
        message: { type: string }
        lockedUntil: { type: string, format: date-time }
    Language:
      # Must match codeLanguageSchema in packages/shared/src/code-run.ts.
      type: string
      enum: [python, javascript, java]
    DraftRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [code, mcq] }
        language: { $ref: '#/components/schemas/Language' }
        code: { type: string, maxLength: 100000 } # MAX_SOURCE_CODE_LENGTH in packages/shared
        selectedOptionId: { type: string, nullable: true }
    RunRequest:
      type: object
      required: [language, code]
      properties:
        language: { $ref: '#/components/schemas/Language' }
        code: { type: string, maxLength: 100000 } # MAX_SOURCE_CODE_LENGTH in packages/shared
    SampleTestResult:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [passed, failed] }
        input: { type: string }
        expectedOutput: { type: string }
        actualOutput: { type: string }
        durationMs: { type: integer }
    RunResult:
      type: object
      required: [outcome, tests, stdout, stderr]
      properties:
        outcome:
          type: string
          enum: [completed, compile_error, runtime_error, time_limit_exceeded]
        tests:
          type: array
          items: { $ref: '#/components/schemas/SampleTestResult' }
        stdout: { type: string }
        stderr: { type: string }
    SampleTest:
      type: object
      required: [id, name, input, expectedOutput]
      properties:
        id: { type: string }
        name: { type: string }
        input: { type: string }
        expectedOutput: { type: string }
    Question:
      type: object
      required: [id, type, title, points, statementMarkdown]
      properties:
        id: { type: string }
        type: { type: string, enum: [coding, mcq] }
        title: { type: string }
        points: { type: integer }
        statementMarkdown: { type: string }
        languages:
          type: array
          items: { $ref: '#/components/schemas/Language' }
        starterCode:
          type: object
          description: Starter code keyed by language
          additionalProperties: { type: string }
        sampleTests:
          type: array
          items: { $ref: '#/components/schemas/SampleTest' }
        options:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
    CandidateSession:
      type: object
      required: [testTitle, testDeadlineAt, section, questions]
      properties:
        testTitle: { type: string }
        testDeadlineAt: { type: string, format: date-time }
        section:
          type: object
          required: [id, position, totalSections, title, deadlineAt]
          properties:
            id: { type: string }
            position: { type: integer }
            totalSections: { type: integer }
            title: { type: string }
            deadlineAt: { type: string, format: date-time, nullable: true }
        questions:
          type: array
          description: Questions of the open section only
          items: { $ref: '#/components/schemas/Question' }
