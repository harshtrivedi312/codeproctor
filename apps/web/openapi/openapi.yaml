              schema: { $ref: '#/components/schemas/Problem' }
    post:
      operationId: addAiReference
      summary: WEB-ONLY placeholder [BE-04c]. Add a solution collected from an AI assistant (audited as ai_reference.create).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiReferenceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiReference' }
        '400':
          description: Invalid
