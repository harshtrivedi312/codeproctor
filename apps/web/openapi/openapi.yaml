openapi: 3.0.3
info:
  title: CodeProctor API (frontend mock contract)
  version: 0.0.0-mock
  description: |
    Hand-written, minimal contract for the endpoints that apps/web calls through MSW mocks.
    There is no backend OpenAPI spec yet. When the NestJS API publishes its generated spec, replace
    this file with it, re-run `pnpm --filter @codeproctor/web gen:api`, and delete the matching
    mocks in src/mocks. Paths and shapes below are placeholders, not the final API.
servers:
  - url: http://localhost:4000
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /v1/time:
    get:
      operationId: getServerTime
      summary: Server clock, used to seed client countdown timers (FR-505)
      responses:
        '200':
          description: Current server time
          content:
            application/json:
              schema:
                type: object
                required: [serverNow]
                properties:
                  serverNow: { type: string, format: date-time }
  /v1/candidate/session:
    get:
      operationId: getCandidateSession
      summary: The candidate's running session with the open section and its questions (FR-301, FR-505)
      responses:
        '200':
          description: Session snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateSession'
  /v1/candidate/questions/{questionId}/draft:
    put:
      operationId: saveDraft
      summary: Autosave a code draft or an answer (FR-504)
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRequest'
      responses:
        '200':
          description: Draft stored
          content:
            application/json:
              schema:
                type: object
                required: [savedAt]
                properties:
                  savedAt: { type: string, format: date-time }
  /v1/candidate/questions/{questionId}/run:
    post:
      operationId: runSampleTests
      summary: Run code against the sample tests (FR-502). One run per 5 seconds.
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '200':
          description: Sample test results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
        '429':
          description: Too many runs
          content:
            application/json:
              schema:
                type: object
                required: [retryAfterSeconds]
                properties:
                  retryAfterSeconds: { type: integer }
  /v1/candidate/sections/{sectionId}/finish:
    post:
      operationId: finishSection
      summary: 'Finish the open section. Final, it cannot be reopened (ADR 0002 S-1).'
      parameters:
        - name: sectionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Section closed
          content:
            application/json:
              schema:
                type: object
                required: [finishedAt]
                properties:
                  finishedAt: { type: string, format: date-time }
                  nextSectionId: { type: string, nullable: true }
  /v1/auth/login:
    post:
      operationId: login
      summary: Staff password login (FR-101). Placeholder path, see fsd.md section 4 (/auth/login).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 1024 }
      responses:
        '200':
          description: Signed in, or a second step is needed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          description: >-
            Sign-in failed. One generic answer for a wrong password, an unknown email and a locked
            account (15 minutes after 5 failed attempts, FR-101); the API never reveals which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/2fa/enroll/start:
    post:
      operationId: startTwoFactorEnrollment
      summary: Begin forced TOTP enrollment (FR-102). Needs the challenge token from login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      responses:
        '200':
          description: Secret and otpauth URI for the QR code
          content:
            application/json:
              schema:
                type: object
                required: [manualKey, otpauthUri]
                properties:
                  manualKey: { type: string }
                  otpauthUri: { type: string }
        '401':
          description: Challenge expired, sign in again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/2fa/enroll/confirm:
    post:
      operationId: confirmTwoFactorEnrollment
      summary: Confirm enrollment with a first code; returns the one-time recovery codes (ADR 0003 section 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code: { type: string, maxLength: 6 }
      responses:
        '200':
          description: Enrolled and signed in
          content:
            application/json:
              schema:
                type: object
                required: [session, recoveryCodes]
                properties:
                  session: { $ref: '#/components/schemas/AuthSession' }
                  recoveryCodes:
                    type: array
                    items: { type: string }
        '400':
          description: Wrong code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Challenge expired, sign in again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/2fa/setup/start:
    post:
      operationId: startTwoFactorSetup
      summary: Signed-in user begins optional TOTP set-up. Mirrors backend PR #26 (FR-102, FU-BE-39).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '200':
          description: Secret, otpauth URI and QR code (PNG data URL)
          content:
            application/json:
              schema:
                type: object
                required: [manualKey, otpauthUri, qrDataUrl]
                properties:
                  manualKey: { type: string }
                  otpauthUri: { type: string }
                  qrDataUrl: { type: string }
        '400':
          description: Missing or invalid currentPassword or totpCode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Wrong current password or locked account, one identical body with code REAUTH_FAILED. Never a session expiry (that is 401).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Two-factor was turned on concurrently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/auth/2fa/setup/confirm:
    post:
      operationId: confirmTwoFactorSetup
      summary: Confirm optional set-up with a first code; returns the one-time recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, code]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 1024 }
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: Two-factor is on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '400':
          description: Wrong code, or missing or invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Wrong current password or locked account, one identical body with code REAUTH_FAILED. Never a session expiry (that is 401).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Two-factor state changed concurrently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/auth/2fa/disable:
    post:
      operationId: disableTwoFactor
      summary: Turn TOTP off. Needs password and TOTP code; revokes all refresh tokens and clears the cookie (backend PR #51). Not for Super Admin and Reviewer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, totpCode]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 1024 }
                totpCode:
                  {
                    type: string,
                    minLength: 6,
                    maxLength: 6,
                    description: 6-digit TOTP code only; a recovery code is 400,
                  }
      responses:
        '204':
          description: Two-factor is off and every refresh token of the user is revoked (sign in again)
        '400':
          description: Missing or invalid currentPassword or totpCode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: REAUTH_FAILED for a wrong or locked password or a wrong or replayed code (one identical body), otherwise TWO_FACTOR_REQUIRED_FOR_ROLE for Super Admin and Reviewer (checked last)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Two-factor is not on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Temporary outage (for example the code store); no failure is counted, try again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/auth/2fa/recovery-codes/regenerate:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace all recovery codes; the old set stops working
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '200':
          description: The new codes, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '400':
          description: Missing or invalid currentPassword or totpCode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Wrong current password or locked account, one identical body with code REAUTH_FAILED. Never a session expiry (that is 401).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Two-factor is not on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/auth/2fa/verify:
    post:
      operationId: verifyTwoFactor
      summary: Complete login with a 6-digit TOTP code or a recovery code (FR-102, ADR 0003 section 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: Wrong code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Challenge expired, sign in again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh cookie and return a new access token (FR-104). Cookie is httpOnly.
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: No valid refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh-token family and clear the cookie
      responses:
        '204':
          description: Signed out
  /v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Request a reset link. Always 202 with the same body (FR-107, D-22).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        '202':
          description: Accepted, whether or not the account exists
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a password with a single-use reset or invite token (FR-107, ADR 0003 section 4). Never signs in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, maxLength: 256 }
                newPassword: { type: string, maxLength: 1024 }
      responses:
        '204':
          description: Password set, token consumed
        '400':
          description: Token invalid, expired or already used (one message for all three)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  # ---- Staff administration (FE-03). Placeholder paths; the real ones come from BE-03 / ARC-02. ----
  /v1/admin/users:
    get:
      operationId: listStaffUsers
      summary: Staff users of the caller's organisation (SUPER_ADMIN, FR-103)
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StaffUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: inviteStaffUser
      summary: Invite a staff user by email; they set a password from the emailed link (ADR 0003 section 4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, role]
              properties:
                email: { type: string, maxLength: 254 }
                name: { type: string, maxLength: 100 }
                role: { $ref: '#/components/schemas/StaffRole' }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffUser' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A user with this email already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/admin/users/{userId}:
    patch:
      operationId: updateStaffUser
      summary: Change a role or deactivate or reactivate a user (revokes their refresh tokens)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/StaffRole' }
                active: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such user in this organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Refused, for example deactivating yourself or the last Super Admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/admin/settings:
    get:
      operationId: getOrgSettings
      summary: Organisation settings (retention, erasure hold, risk scoring, decline contact)
      responses:
        '200':
          description: Settings, with defaults for missing keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      operationId: updateOrgSettings
      summary: Change some organisation settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgSettingsPatch' }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgSettings' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/consent-texts:
    get:
      operationId: listConsentTexts
      summary: Consent document versions (D-17), newest first
      responses:
        '200':
          description: Versions and whether this environment refuses unapproved texts
          content:
            application/json:
              schema:
                type: object
                required: [items, legalApprovalRequired]
                properties:
                  legalApprovalRequired:
                    type: boolean
                    description: REQUIRE_LEGAL_APPROVED_CONSENT (true in pilot and production)
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConsentText' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createConsentText
      summary: Add a new version. It starts as a placeholder; Legal approval is recorded outside this API (Q-43).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, bodyMd]
              properties:
                version: { type: string, maxLength: 40 }
                bodyMd: { type: string, maxLength: 50000 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentText' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: This version name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/admin/consent-texts/{consentTextId}/current:
    put:
      operationId: setCurrentConsentText
      summary: Make this version the one candidates sign
      parameters:
        - name: consentTextId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Now current
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentText' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Refused because the text is not approved by Legal and approval is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/admin/candidates:
    get:
      operationId: listCandidates
      summary: Candidates of the organisation with their erasure state (list view only; the full page is FE-05)
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CandidateSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/candidates/{candidateId}/erasure:
    post:
      operationId: requestCandidateErasure
      summary: Request erasure of a candidate's data (NFR-05, D-19). Waits while a review or appeal is open if the hold is on.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Accepted; the body says whether it waits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such candidate in this organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  # ---------------------------------------------------------------------------------------------
  # Question bank (FR-201..FR-205, FE-04). PLACEHOLDER contract, tagged [ARC-02] in
  # docs/followups/frontend.md: the hub pins the real one. Author-only for detail endpoints.
  # ---------------------------------------------------------------------------------------------
  /v1/questions:
    get:
      operationId: listQuestions
      summary: Questions of the organisation (list view). Needs question:read.
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/QuestionSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createQuestion
      summary: Create a question as draft version 1 (TC-010). Needs question:create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionDetail' }
        '400':
          description: Invalid content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/questions/{questionId}:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getQuestion
      summary: The current version with its tests, variants, reference solutions and answer key. Author only, never sent to candidates (TC-011).
      responses:
        '200':
          description: Question
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    patch:
      operationId: updateQuestion
      summary: Save the content. A published version is immutable, so this creates the next draft version (FR-204). Needs the revision the editor started from; 409 stale_version when someone saved since.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionUpdate' }
      responses:
        '200':
          description: Saved; the returned version is the one that was edited or created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionDetail' }
        '400':
          description: Invalid content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: stale_version, the question was saved by someone else since the editor loaded it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/questions/{questionId}/versions:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listQuestionVersions
      summary: Version history (FR-204)
      responses:
        '200':
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/QuestionVersionSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/questions/{questionId}/versions/{version}:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getQuestionVersion
      summary: One version, read-only (published versions never change)
      responses:
        '200':
          description: Version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/questions/{questionId}/validate:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: validateQuestion
      summary: Start a validation job of the saved version (reference solution on every slot of every active variant, ADR 0007 V-3)
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationJobRef' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/questions/{questionId}/prefill:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: prefillVariantOutputs
      summary: Run the reference solution on a variant's inputs and PROPOSE expected outputs (ADR 0007). Nothing is stored; the author must accept the proposals.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrefillRequest' }
      responses:
        '200':
          description: One proposal per slot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrefillResponse' }
        '400':
          description: Invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/questions/{questionId}/validation/{jobId}:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
      - name: jobId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getValidationJob
      summary: Poll a validation job
      responses:
        '200':
          description: Job state; the report is present when done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationJob' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/questions/{questionId}/publish:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: publishQuestion
      summary: Publish the current draft version. Refused (409) without a passing validation of the saved content (TC-012), without the AI reference solutions of the publish gate (ADR 0005 AI-5), or when the revision is not the current one (stale_version).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: validation_required, ai_references_missing, or stale_version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/questions/{questionId}/ai-references:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listAiReferences
      summary: AI reference solutions of the current version, including superseded rows (D-20). Similarity only, never grading.
      responses:
        '200':
          description: Rows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AiReference' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    post:
      operationId: addAiReference
      summary: Add a solution collected from an AI assistant (audited as ai_reference.create)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiReferenceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiReference' }
        '400':
          description: Invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/questions/{questionId}/ai-references/{referenceId}/supersede:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
      - name: referenceId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: supersedeAiReference
      summary: Replace a row with a newer one; the old row keeps existing with supersededAt set (append-only, ADR 0005 AI-1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiReferenceInput' }
      responses:
        '201':
          description: The new row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiReference' }
        '400':
          description: Invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

components:
  responses:
    Forbidden:
      description: The role is not allowed to call this route (FR-103)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  parameters:
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string }
  schemas:
    StaffRole:
      # Must match UserRole in prisma/schema.prisma.
      type: string
      enum: [SUPER_ADMIN, RECRUITER, AUTHOR, REVIEWER]
    AuthUser:
      type: object
      required: [id, email, name, role, orgName, totpEnabled]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        orgName: { type: string }
        # Backend adds this to AuthUserDto (login, 2fa/verify, enroll-confirm, refresh).
        totpEnabled: { type: boolean }
    AuthSession:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/AuthUser' }
    ChallengeRequest:
      type: object
      required: [challengeToken]
      properties:
        challengeToken: { type: string }
    LoginResult:
      type: object
      required: [status]
      properties:
        status:
          {
            type: string,
            enum: [authenticated, two_factor_required, two_factor_enrollment_required],
          }
        session: { $ref: '#/components/schemas/AuthSession' }
        challengeToken: { type: string }
    QuestionType:
      type: string
      enum: [CODING, MCQ, SHORT_ANSWER]
    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
    QuestionStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    QuestionSummary:
      type: object
      required: [id, slug, title, type, difficulty, tags, status, version, updatedAt]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        type: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        tags: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/QuestionStatus' }
        version: { type: integer, description: Latest version number }
        updatedAt: { type: string, format: date-time }
    ParamType:
      type: string
      enum: [string, number, boolean, array]
    ParamDef:
      type: object
      required: [name, type]
      properties:
        name: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$' }
        type: { $ref: '#/components/schemas/ParamType' }
    Limits:
      type: object
      required: [cpuMs, wallMs, memoryKb]
      properties:
        cpuMs: { type: integer, minimum: 100, maximum: 60000 }
        wallMs: { type: integer, minimum: 100, maximum: 120000 }
        memoryKb: { type: integer, minimum: 16384, maximum: 2097152 }
    TestCase:
      type: object
      required: [id, input, expectedOutput, isHidden, weight]
      properties:
        id: { type: string, description: Client-generated for new rows }
        input: { type: string }
        expectedOutput: { type: string }
        isHidden: { type: boolean }
        weight: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 1000 }
    VariantOverride:
      type: object
      required: [testCaseId, input, expectedOutput]
      properties:
        testCaseId: { type: string }
        input: { type: string }
        expectedOutput: { type: string }
    Variant:
      type: object
      required: [id, label, params, active, overrides]
      properties:
        id: { type: string }
        label: { type: string }
        params: { type: object, additionalProperties: true }
        active: { type: boolean }
        overrides: { type: array, items: { $ref: '#/components/schemas/VariantOverride' } }
    McqOption:
      type: object
      required: [id, text]
      properties:
        id: { type: string }
        text: { type: string }
    McqAnswerSpec:
      type: object
      required: [type, options, correctOptionIds, multiple]
      properties:
        type: { type: string, enum: [MCQ] }
        options: { type: array, items: { $ref: '#/components/schemas/McqOption' } }
        correctOptionIds: { type: array, items: { type: string } }
        multiple: { type: boolean }
    ShortAnswerSpec:
      type: object
      required: [type, canonical, acceptedVariants]
      properties:
        type: { type: string, enum: [SHORT_ANSWER] }
        canonical: { type: string }
        acceptedVariants: { type: array, items: { type: string } }
    AnswerSpec:
      oneOf:
        - $ref: '#/components/schemas/McqAnswerSpec'
        - $ref: '#/components/schemas/ShortAnswerSpec'
    QuestionContent:
      type: object
      required:
        [
          title,
          statementMd,
          difficulty,
          tags,
          allowedLanguages,
          limits,
          starterCode,
          referenceSolution,
          paramSchema,
          testCases,
          variants,
          answerSpec,
        ]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        statementMd:
          {
            type: string,
            maxLength: 50000,
            description: Markdown,
            no raw HTML; may contain Mustache placeholders,
          }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        tags: { type: array, items: { type: string } }
        allowedLanguages: { type: array, items: { $ref: '#/components/schemas/Language' } }
        limits: { $ref: '#/components/schemas/Limits' }
        starterCode: { type: object, additionalProperties: { type: string } }
        referenceSolution: { type: object, additionalProperties: { type: string } }
        paramSchema: { type: array, items: { $ref: '#/components/schemas/ParamDef' } }
        testCases: { type: array, items: { $ref: '#/components/schemas/TestCase' } }
        variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
        answerSpec:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AnswerSpec'
    QuestionUpdate:
      allOf:
        - $ref: '#/components/schemas/QuestionContent'
        - type: object
          required: [expectedRevision]
          properties:
            expectedRevision: { type: integer, minimum: 1 }
    PublishRequest:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision:
          {
            type: integer,
            minimum: 1,
            description: The revision that was validated; 409 stale_version if the question was saved since,
          }
    QuestionCreate:
      allOf:
        - $ref: '#/components/schemas/QuestionContent'
        - type: object
          required: [type]
          properties:
            type: { $ref: '#/components/schemas/QuestionType' }
    ValidationOutcome:
      type: string
      enum: [pass, wrong_answer, runtime_error, compile_error, limit_exceeded]
    ValidationResult:
      type: object
      required: [variantId, variantLabel, testCaseId, position, language, outcome]
      properties:
        variantId: { type: string, nullable: true, description: Null for the base statement }
        variantLabel: { type: string }
        testCaseId: { type: string }
        position: { type: integer, minimum: 1 }
        language: { $ref: '#/components/schemas/Language' }
        outcome: { $ref: '#/components/schemas/ValidationOutcome' }
        message: { type: string }
    ValidationReport:
      type: object
      required: [passed, finishedAt, results]
      properties:
        passed: { type: boolean }
        finishedAt: { type: string, format: date-time }
        results: { type: array, items: { $ref: '#/components/schemas/ValidationResult' } }
    ValidationJobRef:
      type: object
      required: [jobId, revision]
      properties:
        jobId: { type: string }
        revision: { type: integer, minimum: 1, description: The content revision the job validates }
    ValidationJob:
      type: object
      required: [jobId, revision, status]
      properties:
        jobId: { type: string }
        revision:
          {
            type: integer,
            minimum: 1,
            description: The content revision the job validated; a report for an older revision must never be shown as current,
          }
        status: { type: string, enum: [queued, running, done, failed] }
        report: { $ref: '#/components/schemas/ValidationReport' }
        error: { type: string }
    AiReferencePolicy:
      type: object
      required: [refreshDays, minAssistants]
      description: Org settings aiReferences.* (ADR 0005 AI-4, AI-5), read-only here because Authors cannot read org settings
      properties:
        refreshDays: { type: integer, minimum: 1 }
        minAssistants: { type: integer, minimum: 0 }
    QuestionVersion:
      allOf:
        - $ref: '#/components/schemas/QuestionContent'
        - type: object
          required: [version, revision, isPublished, createdAt, validatedAt, validationReport]
          properties:
            version: { type: integer, minimum: 1 }
            revision:
              {
                type: integer,
                minimum: 1,
                description: Content revision of the question,
                monotonic and bumped by every save (also when a save creates the next version). Used for optimistic concurrency and to tie a validation to the exact content.,
              }
            isPublished: { type: boolean }
            createdAt: { type: string, format: date-time }
            validatedAt:
              { type: string, format: date-time, nullable: true, description: Cleared by any save }
            validationReport:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ValidationReport'
    QuestionDetail:
      type: object
      required: [id, slug, type, status, latestVersion, aiReferencePolicy, current]
      properties:
        id: { type: string }
        slug: { type: string }
        type: { $ref: '#/components/schemas/QuestionType' }
        status: { $ref: '#/components/schemas/QuestionStatus' }
        latestVersion: { type: integer, minimum: 1 }
        aiReferencePolicy: { $ref: '#/components/schemas/AiReferencePolicy' }
        current: { $ref: '#/components/schemas/QuestionVersion' }
    QuestionVersionSummary:
      type: object
      required: [version, isPublished, createdAt, createdByName, validatedAt]
      properties:
        version: { type: integer }
        isPublished: { type: boolean }
        createdAt: { type: string, format: date-time }
        createdByName: { type: string }
        validatedAt: { type: string, format: date-time, nullable: true }
    AiReferenceInput:
      type: object
      required: [assistant, modelLabel, language, solutionCode, collectedAt]
      properties:
        assistant: { type: string, minLength: 1, maxLength: 80 }
        modelLabel: { type: string, minLength: 1, maxLength: 80 }
        language: { $ref: '#/components/schemas/Language' }
        solutionCode: { type: string, minLength: 1, maxLength: 100000 }
        promptText: { type: string, maxLength: 20000 }
        collectedAt: { type: string, format: date-time }
        variantId: { type: string, nullable: true, description: Null means the base statement }
    AiReference:
      allOf:
        - $ref: '#/components/schemas/AiReferenceInput'
        - type: object
          required: [id, collectedByName, supersededAt]
          properties:
            id: { type: string }
            collectedByName: { type: string }
            supersededAt: { type: string, format: date-time, nullable: true }
    PrefillRequest:
      type: object
      required: [language, params, referenceSolution, slots]
      properties:
        language: { $ref: '#/components/schemas/Language' }
        params: { type: object, additionalProperties: true }
        referenceSolution:
          {
            type: string,
            maxLength: 100000,
            description: The template as edited (may be unsaved); the API renders it with params,
          }
        slots:
          type: array
          items:
            type: object
            required: [testCaseId, input]
            properties:
              testCaseId: { type: string }
              input:
                {
                  type: string,
                  description: The input that applies to this variant,
                  override or default,
                }
    PrefillResponse:
      type: object
      required: [proposals]
      properties:
        proposals:
          type: array
          items:
            type: object
            required: [testCaseId]
            properties:
              testCaseId: { type: string }
              expectedOutput: { type: string }
              error:
                {
                  type: string,
                  description: Why no output could be produced (runtime error,
                  limit),
                }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ProblemDetails:
      # RFC 7807 problem JSON from the API's global filter (PR #26). `code` appears only on coded errors.
      type: object
      required: [type, title, status, instance, traceId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors: { type: array, items: { type: string } }
        code: { type: string, enum: [REAUTH_FAILED, TWO_FACTOR_REQUIRED_FOR_ROLE] }
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }
    Language:
      # Must match codeLanguageSchema in packages/shared/src/code-run.ts.
      type: string
      enum: [python, javascript, java]
    DraftRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [code, mcq] }
        language: { $ref: '#/components/schemas/Language' }
        code: { type: string, maxLength: 100000 } # MAX_SOURCE_CODE_LENGTH in packages/shared
        selectedOptionId: { type: string, nullable: true }
    RunRequest:
      type: object
      required: [language, code]
      properties:
        language: { $ref: '#/components/schemas/Language' }
        code: { type: string, maxLength: 100000 } # MAX_SOURCE_CODE_LENGTH in packages/shared
    SampleTestResult:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [passed, failed] }
        input: { type: string }
        expectedOutput: { type: string }
        actualOutput: { type: string }
        durationMs: { type: integer }
    RunResult:
      type: object
      required: [outcome, tests, stdout, stderr]
      properties:
        outcome:
          type: string
          enum: [completed, compile_error, runtime_error, time_limit_exceeded]
        tests:
          type: array
          items: { $ref: '#/components/schemas/SampleTestResult' }
        stdout: { type: string }
        stderr: { type: string }
    SampleTest:
      type: object
      required: [id, name, input, expectedOutput]
      properties:
        id: { type: string }
        name: { type: string }
        input: { type: string }
        expectedOutput: { type: string }
    Question:
      type: object
      required: [id, type, title, points, statementMarkdown]
      properties:
        id: { type: string }
        type: { type: string, enum: [coding, mcq] }
        title: { type: string }
        points: { type: integer }
        statementMarkdown: { type: string }
        languages:
          type: array
          items: { $ref: '#/components/schemas/Language' }
        starterCode:
          type: object
          description: Starter code keyed by language
          additionalProperties: { type: string }
        sampleTests:
          type: array
          items: { $ref: '#/components/schemas/SampleTest' }
        options:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
    CandidateSession:
      type: object
      required: [testTitle, testDeadlineAt, section, questions]
      properties:
        testTitle: { type: string }
        testDeadlineAt: { type: string, format: date-time }
        section:
          type: object
          required: [id, position, totalSections, title, deadlineAt]
          properties:
            id: { type: string }
            position: { type: integer }
            totalSections: { type: integer }
            title: { type: string }
            deadlineAt: { type: string, format: date-time, nullable: true }
        questions:
          type: array
          description: Questions of the open section only
          items: { $ref: '#/components/schemas/Question' }
    StaffUser:
      type: object
      required: [id, email, name, role, status]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        status: { type: string, enum: [invited, active, deactivated] }
        lastLoginAt: { type: string, format: date-time, nullable: true }
    EventSeverity:
      # Must match SEVERITIES in packages/shared/src/events.ts.
      type: string
      enum: [LOW, MEDIUM, HIGH]
    RiskSettings:
      type: object
      description: FR-804 and ADR 0005 section 2. Weights are keyed by event type.
      required: [severityPoints, capPerType, bandMinScore, weights]
      properties:
        severityPoints:
          type: object
          required: [LOW, MEDIUM, HIGH]
          properties:
            LOW: { type: integer, minimum: 0, maximum: 100 }
            MEDIUM: { type: integer, minimum: 0, maximum: 100 }
            HIGH: { type: integer, minimum: 0, maximum: 100 }
        capPerType: { type: integer, minimum: 1, maximum: 20 }
        bandMinScore:
          type: object
          required: [MEDIUM, HIGH]
          properties:
            MEDIUM: { type: integer, minimum: 1, maximum: 99 }
            HIGH: { type: integer, minimum: 2, maximum: 100 }
        weights:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 5 }
    OrgSettings:
      type: object
      required: [retentionDays, erasure, risk, consentDeclineContact]
      properties:
        retentionDays: { type: integer, minimum: 7, maximum: 730 }
        erasure:
          type: object
          required: [holdWhileReviewOrAppealOpen]
          properties:
            holdWhileReviewOrAppealOpen: { type: boolean }
        risk: { $ref: '#/components/schemas/RiskSettings' }
        consentDeclineContact: { type: string, maxLength: 300 }
    OrgSettingsPatch:
      type: object
      properties:
        retentionDays: { type: integer, minimum: 7, maximum: 730 }
        erasure:
          type: object
          properties:
            holdWhileReviewOrAppealOpen: { type: boolean }
        risk: { $ref: '#/components/schemas/RiskSettings' }
        consentDeclineContact: { type: string, maxLength: 300 }
    ConsentText:
      type: object
      required: [id, version, bodyMd, createdAt, legalApprovedAt, isCurrent]
      properties:
        id: { type: string }
        version: { type: string }
        bodyMd: { type: string }
        createdAt: { type: string, format: date-time }
        legalApprovedAt: { type: string, format: date-time, nullable: true }
        legalApprovedBy: { type: string, nullable: true }
        isCurrent: { type: boolean }
    CandidateSummary:
      type: object
      required: [id, name, email, erasure]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        lastSessionAt: { type: string, format: date-time, nullable: true }
        erasure:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [none, waiting, queued, erased]
              description: waiting = held while a review or appeal is open (D-19)
            requestedAt: { type: string, format: date-time, nullable: true }
            waitingFor: { type: string, enum: [review, appeal], nullable: true }
