          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrefillResponse' }
        '400':
          description: Invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/ServerError'
  # ---- Validate job (REAL, BE-04c): question:validate ---------------------------------------------
  /v1/questions/{questionId}/validate:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: validateQuestion
      summary: >-
        REAL. Start validating the latest DRAFT (question:validate, coding
        questions only): the reference solution of every allowed language runs
        on every test slot of every active variant with that variant's data. The
        run happens after the response; poll GET .../validation. The result is
        bound to the revision returned here. One run per question at a time.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartValidation' }
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationStarted' }
        '400':
          description: Validation failed (a malformed expectedRevision, an unknown field)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: No draft to validate, the question is archived, a run is already in
            progress, or the draft changed since expectedRevision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Not a coding question, or a variant does not render (errors[] says
            which)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/questions/{questionId}/validation:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getValidation
      summary: >-
        REAL. The state of the latest validation run of the latest version and
        its stored report (question:validate). There is no job id in the path:
        one status per question. A run whose content changed meanwhile is STALE
        and never opens the publish gate.
      responses:
        '200':
          description: The status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationStatus' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
  # ---- AI reference solutions (REAL, BE-04c): ai_reference:read, create, supersede ----------------
  /v1/questions/{questionId}/versions/{version}/ai-references:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: listAiReferences
      summary: REAL. The AI reference solutions of a version, current and superseded
        (ai_reference:read). Rows belong to ONE version; a new version starts
        with none. Never shown to recruiters or candidates, never used for
        grading.
      responses:
        '200':
          description: Rows, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiReferenceList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question or version in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
    post:
      operationId: addAiReference
      summary: REAL. Record an AI reference solution for a language of a version
        (ai_reference:create, append-only). collectedAt is the server's time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAiReference' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiReference' }
        '400':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question, version or variant in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The question is archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Not a coding question, or the language is not an allowed language
            of the version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/questions/{questionId}/versions/{version}/ai-references/{aiReferenceId}/supersede:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: aiReferenceId
