  # ---- Variants (REAL, BE-04b): question:update except the candidate-shaped preview -------------
  /v1/questions/{questionId}/versions/{version}/variants:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: listVariants
      summary: REAL. The variants of a version with params and per-slot overrides,
        plus the version revision (question:update). The writer detail carries
        the same variants in version.variants.
      responses:
        '200':
          description: Variants and the revision to send back as expectedRevision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question or version in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
    post:
      operationId: createVariant
      summary: REAL. Add a variant to a draft version (question:update). Every
        {{placeholder}} of the statement, starter code and reference solution of
        an ACTIVE variant needs a param (400 otherwise). At most 50 per version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVariant' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantMutation' }
        '400':
          description: Validation failed or a placeholder has no param
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question or version in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The version is published (immutable), the question is archived, or
            expectedRevision is stale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Not a coding question, or too many variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/questions/{questionId}/versions/{version}/variants/{variantId}:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: variantId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateVariant
      summary: REAL. Change the params or the active flag of a variant of a draft
        (question:update). An empty body is 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVariant' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantMutation' }
        '400':
          description: Validation failed, a placeholder has no param, or no field sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question, version or variant in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The version is published (immutable), the question is archived, or
            expectedRevision is stale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: removeVariant
      summary: REAL. Remove a variant and its overrides from a draft
        (question:update). The revision check is a query parameter.
      parameters:
        - name: expectedRevision
          in: query
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: Removed. Answers the new revision of the version, computed in the
            same transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionResult' }
        '400':
          description: Invalid expectedRevision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question, version or variant in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: 'The version is published (immutable), the question is archived,
            expectedRevision is stale, or the variant has AI reference rows
            (code VARIANT_HAS_AI_REFERENCES: they are never deleted, set the
            variant inactive instead)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/questions/{questionId}/versions/{version}/variants/{variantId}/preview:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: variantId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: previewVariant
      summary: >-
        REAL. The candidate-shaped view of one variant: rendered statement and
        starter code, its own sample cases, no params, hidden data, reference
        solution or answer spec (question:read). Without question:update only
        published versions and active variants are visible (404 otherwise). A
        variant that does not render is 422 with reasons for a writer and a
        plain 422 for others.
      responses:
        '200':
          description: The candidate view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateQuestionPreview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question, version or variant in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The variant does not render
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
  /v1/questions/{questionId}/versions/{version}/variants/{variantId}/test-cases/{testCaseId}:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: variantId
        in: path
        required: true
        schema: { type: string }
      - name: testCaseId
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: setVariantOverride
      summary: REAL. Override the input and expected output of one test slot for a
        variant (question:update). The slot must belong to the same version; its
        hidden flag and weight stay the slot's. Answers the override and the new
        revision of the version, computed in the same transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideInput' }
      responses:
        '200':
          description: The override
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantOverrideMutation' }
        '400':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question, version, variant or test slot in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The version is published (immutable), the question is archived, or
            expectedRevision is stale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: removeVariantOverride
      summary: REAL. Remove an override; the slot's own input and output apply again
        (question:update).
      parameters:
        - name: expectedRevision
          in: query
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: Removed. Answers the new revision of the version, computed in the
            same transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question, version, variant or override in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The version is published (immutable), the question is archived, or
            expectedRevision is stale
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/ServerError'
  # ---- WEB-ONLY placeholders: the API has no such route yet -------------------------------------
  /v1/questions/{questionId}/prefill:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: prefillVariantOutputs
      summary: WEB-ONLY placeholder (BE-04b did not add a prefill route; ADR 0007
        helper). Run the reference solution on a variant's inputs and PROPOSE
        expected outputs (ADR 0007). Nothing is stored; the author must accept
        the proposals.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrefillRequest' }
      responses:
        '200':
