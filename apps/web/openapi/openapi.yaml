        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupersedeAiReference' }
      responses:
        '200':
          description: The retired row and the replacement, if any
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupersedeResult' }
        '400':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question, version or AI reference solution in your
            organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Already superseded, or the question is archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The replacement language is not allowed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/ServerError'
  # ---------------------------------------------------------------------------------------------
  # Tests (FR-301, FR-302; REAL since BE-06a, apps/api/src/tests). Roles: SUPER_ADMIN and RECRUITER
  # (test:read, test:create, test:update); an Author or Reviewer gets 403. No revision and no
  # delete or archive route exists. 404 is identical for a missing and a cross-organisation id.
  # ---------------------------------------------------------------------------------------------
  /v1/tests:
    get:
      operationId: listTests
      summary: REAL. Test templates of your organisation (test:read), newest first.
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100000, default: 1 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: profile, in: query, schema: { $ref: '#/components/schemas/TestProfile' } }
        - name: used
          in: query
          description: true only tests that already have invitations, false only tests
            that have none
          schema: { type: boolean }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestList' }
        '400':
          description: Invalid query, or a page deeper than 10 000 rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          $ref: '#/components/responses/Busy'
    post:
      operationId: createTest
      summary: REAL. Create a test with ordered sections, fixed or random questions, a
        STANDARD or STRICT profile and a pass score (test:create).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestDetail' }
        '400':
          description: Validation failed (LOCKDOWN, section limits above the duration, a
            bad random rule, positions, an unknown field); errors[] says what
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: A fixed question version does not exist, is a draft, or is not in
            your organisation (one answer)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: A fixed version belongs to an archived question, or a random rule
            matches too few published questions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/tests/{testId}:
    parameters:
      - name: testId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTest
      summary: REAL. One test with its sections and questions (test:read).
      responses:
        '200':
          description: The test
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestDetail' }
        '400':
          description: Not a UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such test in your organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
    patch:
      operationId: updateTest
      summary: >-
        REAL. Edit a test that has no invitation or session yet (test:update).
        Sections, when sent, replace ALL sections. There is NO revision or
        If-Match: two editors are last-write-wins. passScore cannot be cleared
        once set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTest' }
      responses:
        '200':
          description: The test after the edit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestDetail' }
        '400':
          description: Validation failed, or nothing to change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such test (or question version) in your organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The test already has an invitation or a session and cannot be edited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: A fixed version belongs to an archived question, or a random rule
            is unsatisfiable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/ServerError'
  # ---------------------------------------------------------------------------------------------
  # Invitations and candidate status (FR-303, FR-304, FR-305). WEB-ONLY PLACEHOLDERS [BE-06b]: the
  # API has no invitations module yet (BE-06a is the tests module only). Shapes come from fsd.md
  # FR-302..305, ADR 0002 (state machine), ADR 0015 (waiver) and backend.md Step 6; paths, bodies,
  # limits and error words are the web's proposal, listed in docs/followups/frontend.md. Roles:
  # SUPER_ADMIN and RECRUITER (invitation:create). Nothing here carries a score, a flag or a
  # verdict: recruiters see results only after the verdict (C-28).
  # ---------------------------------------------------------------------------------------------
  /v1/tests/{testId}/invitations:
    parameters:
      - name: testId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: createInvitation
      summary: WEB-ONLY [BE-06b]. Invite one candidate to a test (invitation:create).
        Creates the invitation and its session in status INVITED, and links or
        creates the candidate by email.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitation' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationResult' }
        '400':
          description: Validation failed (email, name, window, accommodations; errors[]
            says which)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Missing or expired access token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such test in your organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: This candidate already has an active invitation to this test, or the
            candidate has asked for erasure. No code; the detail text differs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The test cannot be given to candidates right now (a random slot has
            no question left to draw, or a question was archived). detail is
            "Request validation failed" and errors[] names the slots, for example
            sections[0].questions[0].randomRule matches 0 ...; nothing is created. A
            window that ends in the past is a 400, not a 422. A waiver reason that is
            not enabled would carry code REASON_NOT_ENABLED (ADR 0015).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Too many invitations this hour. The API sends no Retry-After header.
            A 404, 409 or 422 attempt keeps its slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/admin/candidates/{candidateId}/invitations:
    parameters:
      - name: candidateId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listCandidateInvitations
      summary: WEB-ONLY [BE-06b]. The invitations of one candidate with their session
        status and the time each status was reached (invitation:create). Status
        only, no scores, flags or verdicts.
      responses:
        '200':
          description: Invitations, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    { type: array, items: { $ref: '#/components/schemas/CandidateInvitation' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such candidate in your organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          $ref: '#/components/responses/Busy'

  # ---------------------------------------------------------------------------------------------
  # Review workspace (FR-901, FR-902, FR-703). REAL for the three read routes (apps/api/src/review,
  # PR 297). The answer scoring PATCH and the verdict POST follow docs/api-contract.md section 7
  # (BE-13). Roles: REVIEWER and SUPER_ADMIN. Cross-organisation
  # ids are 404.
  # ---------------------------------------------------------------------------------------------
  /v1/review/queue:
    get:
      operationId: listReviewQueue
      summary: REAL. Sessions awaiting or under review, oldest first (review_queue:read). Default filter GRADED + UNDER_REVIEW.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/SessionStatus' } }
        - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 300 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewQueue' }
        '400':
          description: Invalid status, cursor or page size
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          $ref: '#/components/responses/Busy'
  /v1/review/sessions/{sessionId}:
    get:
      operationId: getReviewSession
      summary: REAL. The review bundle of one session (review_session:read).
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The review bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewSession' }
        '400':
          description: Not a UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such session in your organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503':
          $ref: '#/components/responses/Busy'
  /v1/review/sessions/{sessionId}/recordings/{recordingId}/playback:
    get:
      operationId: getReviewPlayback
      summary: REAL. A presigned GET for one recording, valid 900 s (review_session:read). The part urls point at the S3_ENDPOINT host and need that origin in the web CSP connect-src and the bucket CORS.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: recordingId,
            in: path,
            required: true,
            schema: { type: string, pattern: '^(SCREEN|WEBCAM|AUDIO)-\\d{1,9}$' },
          }
      responses:
        '200':
          description: The signed URL or ordered parts. Never cache or store it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPlayback' }
        '400':
          description: Not a UUID, or a recording id that is not KIND-SEGMENT (SCREEN-0)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such session or recording in your organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503':
          description: Object storage is not configured yet (no code; calm message, no retry loop), or BUSY
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /v1/review/sessions/{sessionId}/answers/{sessionQuestionId}:
    patch:
      operationId: scoreReviewAnswer
      summary: REAL (BE-13). Manual scoring of an answer (review_verdict:set, docs/api-contract.md section 7). correct true gives the full points, false gives 0.
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
        - {
            name: sessionQuestionId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScoreAnswer' }
      responses:
        '200':
          description: Decision stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScoredAnswer' }
        '400':
          description: Not a UUID, or an invalid body (correct must be a boolean, note 1 to 1000 characters without control characters)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such session or answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '409':
          description: code ANSWER_NOT_MANUAL, SESSION_NOT_UNDER_REVIEW or VERDICT_ALREADY_SET
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503':
          $ref: '#/components/responses/Busy'
  /v1/review/sessions/{sessionId}/verdict:
    post:
      operationId: setReviewVerdict
      summary: REAL (BE-13). Final verdict (review_verdict:set), 200 with the stored review row. 409 VERDICT_ALREADY_SET or SESSION_NOT_UNDER_REVIEW (checked first), else 409 MANUAL_PENDING while a manual answer is pending (TC-099, docs/api-contract.md section 7).
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetVerdict' }
      responses:
        '200':
          description: Verdict stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewVerdict' }
        '400':
          description: Not a UUID, or an invalid body (verdict enum, note 1 to 2000 characters)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '409':
          description: Pending manual answers, or a verdict is already set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503':
          $ref: '#/components/responses/Busy'

components:
  responses:
    Forbidden:
      description: The role is not allowed to call this route (FR-103). A guard 403
        has no code.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Busy:
      description: 'Lock contention (docs/api-contract.md section 8): 503 with a
        Retry-After header of 1 to 2 seconds and the problem code BUSY. The
        action did NOT happen. The web retries it by itself (up to 3 more times,
        never on credential or re-auth routes). A 503 without code BUSY (for
        example Redis down) is a different answer and is not retried.'
      headers:
        Retry-After:
          description: Seconds to wait before trying again (1 to 2).
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetails'
              - type: object
                properties:
                  code:
                    type: string
                    enum:
                      - BUSY
    ServerError:
      description: 'A fixed 500 with no useful detail, no code and no Retry-After. On
        a staff write it can mean the action committed and only its audit row
        failed afterwards: it is NEVER retried automatically; look at the list
        or the status before trying again.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  parameters:
    QuestionId:
      name: questionId
      in: path
      required: true
      schema: { type: string }
  schemas:
    StaffRole:
      # Must match UserRole in prisma/schema.prisma.
      type: string
      enum: [SUPER_ADMIN, RECRUITER, AUTHOR, REVIEWER]
    AuthUser:
      type: object
      required: [id, email, name, role, orgName, totpEnabled, twoFactorRecommended]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        orgName: { type: string }
        # On every user object the API returns (login, 2fa/verify, refresh, /me).
        totpEnabled: { type: boolean }
        # Always present, equal to !totpEnabled. Two-factor sign-in is optional for every role
        # and recommended: the staff shell shows a dismissible nudge while this is true.
        twoFactorRecommended: { type: boolean }
    AuthSession:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/AuthUser' }
    ChallengeRequest:
      type: object
      required: [challengeToken]
      properties:
        challengeToken: { type: string }
    LoginResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [authenticated, two_factor_required] }
        session: { $ref: '#/components/schemas/AuthSession' }
        challengeToken: { type: string }
    QuestionType:
      type: string
      enum: [CODING, MCQ, SHORT_ANSWER]
    Difficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
    Limits:
      type: object
      required: [cpuMs, wallMs, memoryKb]
      properties:
        cpuMs: { type: integer, minimum: 100, maximum: 10000 }
        wallMs: { type: integer, minimum: 100, maximum: 20000, description: Not below cpuMs }
        memoryKb: { type: integer, minimum: 16384, maximum: 524288 }
    TestCase:
      type: object
      description: >-
        A test slot. For a reader without question:update a HIDDEN case carries
        only id, position, isHidden and weight: the input and expectedOutput
        keys are absent, not null.
      required: [id, position, isHidden, weight]
      properties:
        id: { type: string }
        position: { type: integer, minimum: 0 }
        isHidden: { type: boolean }
        weight: { type: number }
        input: { type: string }
        expectedOutput: { type: string }
    TestCaseInput:
      type: object
      required: [input, expectedOutput]
      properties:
        input: { type: string, maxLength: 100000 }
        expectedOutput: { type: string, maxLength: 100000 }
        isHidden: { type: boolean, default: true }
        weight:
          {
            type: number,
            minimum: 0.01,
            maximum: 9999.99,
            default: 1,
            description: At most 2 decimals,
          }
        position:
          { type: integer, minimum: 0, maximum: 10000, description: Default after the last slot }
        expectedRevision: { type: string, pattern: '^[0-9a-f]{64}$' }
    TestCasePatch:
      type: object
      properties:
        expectedRevision: { type: string, pattern: '^[0-9a-f]{64}$' }
        input: { type: string, maxLength: 100000 }
        expectedOutput: { type: string, maxLength: 100000 }
        isHidden: { type: boolean }
        weight: { type: number, minimum: 0.01, maximum: 9999.99 }
        position: { type: integer, minimum: 0, maximum: 10000 }
    McqOption:
      type: object
      required: [id, text]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{1,32}$' }
        text: { type: string, minLength: 1, maxLength: 1000 }
    McqAnswerSpec:
      type: object
      description: MCQ answer spec (the question type says which shape applies). 2 to
        10 options.
      required: [options, correctOptionIds, multiple]
      properties:
        options:
          {
            type: array,
            minItems: 2,
            maxItems: 10,
            items: { $ref: '#/components/schemas/McqOption' },
          }
        correctOptionIds: { type: array, minItems: 1, maxItems: 10, items: { type: string } }
        multiple: { type: boolean }
    ShortAnswerSpec:
      type: object
      description: SHORT_ANSWER answer spec (D-23).
      required: [canonical, acceptedVariants]
      properties:
        canonical: { type: string, minLength: 1, maxLength: 500 }
        acceptedVariants:
          { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 500 } }
    AnswerSpec:
      oneOf:
        - $ref: '#/components/schemas/McqAnswerSpec'
        - $ref: '#/components/schemas/ShortAnswerSpec'
    QuestionVersionRef:
      type: object
      required: [id, version, isPublished, title, difficulty, validatedAt, createdAt]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        isPublished: { type: boolean }
        title: { type: string }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        validatedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    QuestionSummary:
      type: object
      required: [id, slug, type, tags, isArchived, createdAt, published, latest]
      properties:
        id: { type: string }
        slug: { type: string }
        type: { $ref: '#/components/schemas/QuestionType' }
        tags: { type: array, items: { type: string } }
        isArchived: { type: boolean }
        createdAt: { type: string, format: date-time }
        published:
          nullable: true
          description: The published version tests use; null until the first publish
          allOf:
            - $ref: '#/components/schemas/QuestionVersionRef'
        latest:
          description: Highest version number (maybe a draft); for a reader without
            question:update the highest PUBLISHED version
          allOf:
            - $ref: '#/components/schemas/QuestionVersionRef'
    QuestionList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/QuestionSummary' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    ValidationCell:
      type: object
      required: [language, passed, testsPassed, testsTotal]
      properties:
        language: { $ref: '#/components/schemas/Language' }
        passed: { type: boolean }
        testsPassed: { type: integer, minimum: 0 }
        testsTotal: { type: integer, minimum: 0 }
    ValidationFailure:
      type: object
      required: [language, testCaseId, position, verdict]
      properties:
        language: { $ref: '#/components/schemas/Language' }
        testCaseId: { type: string, nullable: true }
        position: { type: integer, nullable: true, minimum: 0 }
        verdict:
          type: string
          description: >-
            A string on the API. Known values: FAILED, COMPILE_ERROR,
            TIME_LIMIT, MEMORY_LIMIT, OUTPUT_LIMIT, RUNTIME_ERROR,
            INTERNAL_ERROR, MISSING_REFERENCE, LOCAL_STUB (a run on the local
            execution stub, not real execution). A client must cope with a value
            it does not know.
        actualOutput:
          { type: string, description: 'Only for a visible (sample) slot, never a hidden one' }
        diagnostic: { type: string }
    ValidationVariantResult:
      type: object
      required: [variantId, passed, cells, failures]
      properties:
        variantId:
          {
            type: string,
            nullable: true,
            description: Null for the base content (a version with no active variant),
          }
        passed: { type: boolean }
        cells: { type: array, items: { $ref: '#/components/schemas/ValidationCell' } }
        failures: { type: array, items: { $ref: '#/components/schemas/ValidationFailure' } }
    ValidationReport:
      type: object
      description: >-
        Stored in the version's validationReport (question:update readers only).
        `revision` is the content revision the run was bound to, taken under the
        question lock at start: publish refuses a report of any other revision.
        `error` is set when the run could not complete; then passed is false and
        perVariant is empty.
      required: [passed, revision, startedAt, finishedAt, perVariant]
      properties:
        passed: { type: boolean }
        revision: { type: string, pattern: '^[0-9a-f]{64}$' }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        error: { type: string, enum: [EXECUTION_ERROR, TIMEOUT] }
        perVariant: { type: array, items: { $ref: '#/components/schemas/ValidationVariantResult' } }
    StartValidation:
      type: object
      additionalProperties: false
      properties:
        expectedRevision: { type: string, pattern: '^[0-9a-f]{64}$' }
    ValidationStarted:
      type: object
      required: [jobId, status, revision, version, startedAt]
      properties:
        jobId: { type: string }
        status: { type: string, enum: [RUNNING] }
        revision:
          {
            type: string,
            pattern: '^[0-9a-f]{64}$',
            description: The content revision this run validates,
          }
        version: { type: integer, minimum: 1 }
        startedAt: { type: string, format: date-time }
    ValidationStatus:
      type: object
      required:
        [
          status,
          jobId,
          version,
          currentRevision,
          revision,
          startedAt,
          finishedAt,
          validatedAt,
          report,
        ]
      properties:
        status:
          type: string
          description: >-
            NONE never run on this content; RUNNING; PASSED or FAILED finished
            on the current content; STALE the content changed while it ran, the
            result was discarded (publish stays closed); ERROR the run could not
            complete (fail closed).
          enum: [NONE, RUNNING, PASSED, FAILED, STALE, ERROR]
        jobId: { type: string, nullable: true }
        version: { type: integer, minimum: 1 }
        currentRevision: { type: string, pattern: '^[0-9a-f]{64}$' }
        revision: { type: string, nullable: true, description: The revision the run was bound to }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        validatedAt:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: Set only by a passing run of the current content,
          }
        report:
          {
            type: object,
            nullable: true,
            additionalProperties: true,
            description: A ValidationReport when one is stored,
          }
    QuestionVersion:
      description: The full version a caller with question:update gets
      allOf:
        - $ref: '#/components/schemas/QuestionVersionRef'
        - type: object
          required:
            [
              statementMd,
              allowedLanguages,
              limits,
              starterCode,
              referenceSolution,
              answerSpec,
              validationReport,
              revision,
              testCases,
              variants,
            ]
          properties:
            statementMd: { type: string, maxLength: 50000 }
            allowedLanguages: { type: array, items: { $ref: '#/components/schemas/Language' } }
            limits: { $ref: '#/components/schemas/Limits' }
            starterCode: { type: object, additionalProperties: { type: string } }
            referenceSolution: { type: object, additionalProperties: { type: string } }
            answerSpec:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AnswerSpec'
            validationReport:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ValidationReport'
            revision:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: >-
                Opaque SHA-256 of the version content, test cases and variants
                with their overrides (question:update only). Send it back as
                expectedRevision; it changes with every content, test-case,
                variant or override change.
            testCases: { type: array, items: { $ref: '#/components/schemas/TestCase' } }
            variants:
              type: array
              description: Variants with params and overrides (writers only; a reader never
                gets this key).
              items: { $ref: '#/components/schemas/Variant' }
    QuestionVersionRead:
      type: object
      additionalProperties: false
      description: >-
        What a reader without question:update gets of a version: an allowlist.
        No revision, referenceSolution, answerSpec or validationReport, and
        hidden test cases without input and expectedOutput.
      required:
        [
          id,
          version,
          isPublished,
          title,
          difficulty,
          validatedAt,
          createdAt,
          statementMd,
          allowedLanguages,
          limits,
          starterCode,
          testCases,
        ]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        isPublished: { type: boolean }
        title: { type: string }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        validatedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        statementMd: { type: string }
        allowedLanguages: { type: array, items: { $ref: '#/components/schemas/Language' } }
        limits: { $ref: '#/components/schemas/Limits' }
        starterCode: { type: object, additionalProperties: { type: string } }
        testCases: { type: array, items: { $ref: '#/components/schemas/TestCase' } }
    QuestionDetail:
      description: A question with one full version (question:update)
      allOf:
        - $ref: '#/components/schemas/QuestionSummary'
        - type: object
          required: [versions, version, createdNewVersion]
          properties:
            versions:
              {
                type: array,
                items: { $ref: '#/components/schemas/QuestionVersionRef' },
                description: Oldest first,
              }
            version: { $ref: '#/components/schemas/QuestionVersion' }
            createdNewVersion:
              type: boolean
              description: true when this PATCH created a new version because the latest was
                published
    QuestionDetailRedacted:
      type: object
      additionalProperties: false
      description: The detail a reader without question:update gets (an allowlist,
        DL-32, BE-04a staff-view.ts)
      required:
        [
          id,
          slug,
          type,
          tags,
          isArchived,
          createdAt,
          published,
          latest,
          versions,
          version,
          createdNewVersion,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        type: { $ref: '#/components/schemas/QuestionType' }
        tags: { type: array, items: { type: string } }
        isArchived: { type: boolean }
        createdAt: { type: string, format: date-time }
        published:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/QuestionVersionRef'
        latest:
          allOf:
            - $ref: '#/components/schemas/QuestionVersionRef'
        versions: { type: array, items: { $ref: '#/components/schemas/QuestionVersionRef' } }
        version: { $ref: '#/components/schemas/QuestionVersionRead' }
        createdNewVersion: { type: boolean }
    CreateQuestion:
      type: object
      required: [title, statementMd, difficulty]
      properties:
        type: { $ref: '#/components/schemas/QuestionType' }
        slug:
          {
            type: string,
            maxLength: 80,
            description: Unique per organization; generated from the title when omitted,
          }
        title: { type: string, minLength: 1, maxLength: 200 }
        statementMd: { type: string, minLength: 1, maxLength: 50000 }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        tags: { type: array, maxItems: 20, items: { type: string } }
        allowedLanguages: { type: array, items: { $ref: '#/components/schemas/Language' } }
        limits: { $ref: '#/components/schemas/Limits' }
        starterCode: { type: object, additionalProperties: { type: string } }
        referenceSolution: { type: object, additionalProperties: { type: string } }
        answerSpec: { $ref: '#/components/schemas/AnswerSpec' }
        testCases:
          { type: array, maxItems: 100, items: { $ref: '#/components/schemas/TestCaseInput' } }
    UpdateQuestion:
      type: object
      description: Every field is optional, at least one is needed. Test cases have
        their own routes.
      properties:
        expectedRevision: { type: string, pattern: '^[0-9a-f]{64}$' }
        title: { type: string, minLength: 1, maxLength: 200 }
        statementMd: { type: string, minLength: 1, maxLength: 50000 }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        tags: { type: array, maxItems: 20, items: { type: string } }
        allowedLanguages: { type: array, items: { $ref: '#/components/schemas/Language' } }
        limits: { $ref: '#/components/schemas/Limits' }
        starterCode: { type: object, additionalProperties: { type: string } }
        referenceSolution: { type: object, additionalProperties: { type: string } }
        answerSpec: { $ref: '#/components/schemas/AnswerSpec' }
    PublishRequest:
      type: object
      properties:
        expectedRevision: { type: string, pattern: '^[0-9a-f]{64}$' }
    ProblemCode:
      type: string
      description: >-
        The staff machine codes that the docs/api-contract.md preamble lists explicitly. Other staff
        codes of accepted ADRs (ADR 0015: IDENTITY_CHECK_WAIVED, ACCOMMODATION_LOCKED,
        IDENTITY_NOT_WAIVED, DETECTOR_DISABLED, PRECONDITION_FAILED, PRECONDITION_REQUIRED) are
        added here when the web starts branching on them. Guard 403s carry none. BUSY is the 503
        with Retry-After the problem filter answers on database lock contention (DL-37, D-56); a
        client should retry it after Retry-After (the web retries it automatically, bounded, except
        on the credential, re-auth and candidate routes). Candidate-route codes such as
        SESSION_NOT_ACTIVE (ADR 0013 section 5.1) are not staff codes and are not listed here.
      enum:
        [
          REAUTH_FAILED,
          SETTINGS_CONFLICT,
          VARIANT_HAS_AI_REFERENCES,
          BUSY,
          REASON_NOT_ENABLED,
          ANSWER_NOT_MANUAL,
          MANUAL_PENDING,
          SESSION_NOT_UNDER_REVIEW,
          VERDICT_ALREADY_SET,
        ]
    Problem:
      type: object
      description: >-
        RFC 7807 problem body of the question routes. 409 and 422 carry detail
        and errors[]. `code` is present only where a route defines one (see ProblemCode; on these
        routes mainly VARIANT_HAS_AI_REFERENCES, 409, deleting a variant that has AI reference
        rows, and BUSY, 503). The UI branches on status and endpoint, and on that code.
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors: { type: array, items: { type: string } }
        code: { $ref: '#/components/schemas/ProblemCode' }
    VariantOverride:
      type: object
      description: One test slot's input and expected output for a variant. isHidden
        and position come from the slot.
      required: [testCaseId, isHidden, position, input, expectedOutput]
      properties:
        testCaseId: { type: string }
        isHidden: { type: boolean }
        position: { type: integer, minimum: 0 }
        input: { type: string }
        expectedOutput: { type: string }
    Variant:
      type: object
      description: >-
        An explicit variant (ADR 0007). It has NO label or name: the UI names it
        by its place in the list and its params. renderedStatement is the
        statement rendered with params, kept for the author. Variants are sorted
        by id, which is NOT a meaningful order, and a fork gives every variant a
        new id.
      required: [id, isActive, params, renderedStatement, testCaseOverrides]
      properties:
        id: { type: string }
        isActive: { type: boolean }
        params:
          type: object
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
              - { type: boolean }
        renderedStatement: { type: string }
        testCaseOverrides: { type: array, items: { $ref: '#/components/schemas/VariantOverride' } }
    RevisionResult:
      type: object
      description: The revision of a version after a writer-only change (never in a
        recruiter-reachable body).
      required: [revision]
      properties:
        revision:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: The new revision, computed inside the same transaction as the
            change; send it as expectedRevision.
    TestCaseMutation:
      allOf:
        - $ref: '#/components/schemas/TestCase'
        - $ref: '#/components/schemas/RevisionResult'
    VariantOverrideMutation:
      allOf:
        - $ref: '#/components/schemas/VariantOverride'
        - $ref: '#/components/schemas/RevisionResult'
    QuestionUpdateResult:
      description: The edited question plus the revision of the version the edit left
        (the new version after a fork).
      allOf:
        - $ref: '#/components/schemas/QuestionDetail'
        - $ref: '#/components/schemas/RevisionResult'
    VariantList:
      type: object
      required: [items, revision]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Variant' } }
        revision: { type: string, pattern: '^[0-9a-f]{64}$' }
    VariantMutation:
      type: object
      required: [variant, revision]
      properties:
        variant: { $ref: '#/components/schemas/Variant' }
        revision:
          { type: string, pattern: '^[0-9a-f]{64}$', description: The new revision of the version }
    CreateVariant:
      type: object
      additionalProperties: false
      required: [params]
      properties:
        params:
          type: object
          additionalProperties:
            oneOf:
              - { type: string, maxLength: 1000 }
              - { type: number }
              - { type: boolean }
        isActive: { type: boolean, default: true }
        expectedRevision: { type: string, pattern: '^[0-9a-f]{64}$' }
    UpdateVariant:
      type: object
      additionalProperties: false
      properties:
        params:
          type: object
          additionalProperties:
            oneOf:
              - { type: string, maxLength: 1000 }
              - { type: number }
              - { type: boolean }
        isActive: { type: boolean }
        expectedRevision: { type: string, pattern: '^[0-9a-f]{64}$' }
    OverrideInput:
      type: object
      additionalProperties: false
      required: [input, expectedOutput]
      properties:
        input: { type: string, maxLength: 100000 }
        expectedOutput: { type: string, maxLength: 100000 }
        expectedRevision: { type: string, pattern: '^[0-9a-f]{64}$' }
    CandidateQuestionPreview:
      type: object
      additionalProperties: false
      required: [type, title, statementMd, languages, limits, starterCode, samples]
      properties:
        type: { $ref: '#/components/schemas/QuestionType' }
        title: { type: string }
        statementMd: { type: string }
        languages: { type: array, items: { type: string } }
        limits: { $ref: '#/components/schemas/Limits' }
        starterCode: { type: object, additionalProperties: { type: string } }
        samples:
          type: array
          items:
            type: object
            required: [input, expectedOutput]
            properties:
              input: { type: string }
              expectedOutput: { type: string }
        mcq:
          type: object
          required: [multiple, options]
          properties:
            multiple: { type: boolean }
            options:
              type: array
              items:
                type: object
                required: [id, text]
                properties:
                  id: { type: string }
                  text: { type: string }
    AiPolicy:
      type: object
      required: [minAssistants, isDefault, refreshIntervalDays]
      properties:
        minAssistants:
          type: integer
          minimum: 0
          maximum: 5
          description: Assistants required per language to publish; 0 is off.
        isDefault:
          type: boolean
          description: True when the org has no valid setting and the default applies
        refreshIntervalDays:
          type: integer
          nullable: true
          description: AI-4 refresh interval in days; null until the API implements the
            setting.
    CreateAiReference:
      type: object
      additionalProperties: false
      required: [assistant, modelLabel, language, solutionCode]
      properties:
        assistant:
          {
            type: string,
            minLength: 1,
            maxLength: 100,
            description: 'Assistant product name, for example ChatGPT',
          }
        modelLabel: { type: string, minLength: 1, maxLength: 100 }
        language: { $ref: '#/components/schemas/Language' }
        solutionCode: { type: string, minLength: 1, maxLength: 100000 }
        promptText: { type: string, maxLength: 20000 }
        variantId:
          { type: string, description: A variant of this version; absent means the base statement }
    AiReference:
      type: object
      required:
        [
          id,
          variantId,
          assistant,
          modelLabel,
          language,
          solutionCode,
          promptText,
          collectedAt,
          collectedById,
          supersededAt,
          createdAt,
        ]
      properties:
        id: { type: string }
        variantId: { type: string, nullable: true }
        assistant: { type: string }
        modelLabel: { type: string }
        language: { $ref: '#/components/schemas/Language' }
        solutionCode: { type: string }
        promptText: { type: string, nullable: true }
        collectedAt: { type: string, format: date-time, description: Server time of the insert }
        collectedById: { type: string, description: The user id; the API sends no name }
        supersededAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    AiReferenceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AiReference' } }
    SupersedeAiReference:
      type: object
      additionalProperties: false
      properties:
        replacement: { $ref: '#/components/schemas/CreateAiReference' }
    SupersedeResult:
      type: object
      required: [superseded, replacement]
      properties:
        superseded: { $ref: '#/components/schemas/AiReference' }
        replacement: { allOf: [{ $ref: '#/components/schemas/AiReference' }], nullable: true }
    PrefillRequest:
      type: object
      required: [language, params, referenceSolution, slots]
      properties:
        language: { $ref: '#/components/schemas/Language' }
        params: { type: object, additionalProperties: true }
        referenceSolution:
          {
            type: string,
            maxLength: 100000,
            description: The template as edited (may be unsaved); the API renders it with
              params,
          }
        slots:
          type: array
          items:
            type: object
            required: [testCaseId, input]
            properties:
              testCaseId: { type: string }
              input:
                {
                  type: string,
                  description: 'The input that applies to this variant (override or default)',
                }
    PrefillResponse:
      type: object
      required: [proposals]
      properties:
        proposals:
          type: array
          items:
            type: object
            required: [testCaseId]
            properties:
              testCaseId: { type: string }
              expectedOutput: { type: string }
              error:
                {
                  type: string,
                  description: 'Why no output could be produced (runtime error, limit)',
                }
    TestProfile:
      type: string
      description: STANDARD records the web session; STRICT adds a second camera.
        LOCKDOWN is not offered in this build.
      enum: [STANDARD, STRICT]
    RandomRule:
      type: object
      additionalProperties: false
      description: >-
        Exactly { tags?, difficulty?, type? }; unknown keys are refused. There
        is NO count: one question slot picks one question, and N slots with the
        same rule need N different matching published questions. Tags are
        lower-cased, 1 to 20, all must match.
      properties:
        tags: { type: array, minItems: 1, maxItems: 20, items: { type: string } }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        type: { $ref: '#/components/schemas/QuestionType' }
    TestQuestionInput:
      type: object
      additionalProperties: false
      description: Exactly one of questionVersionId and randomRule.
      properties:
        questionVersionId:
          { type: string, description: A PUBLISHED version of a non-archived question }
        randomRule: { $ref: '#/components/schemas/RandomRule' }
        points: { type: number, minimum: 0.01, maximum: 9999.99, default: 100 }
        position: { type: integer, minimum: 1, maximum: 50 }
    TestSectionInput:
      type: object
      additionalProperties: false
      required: [title, questions]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        position: { type: integer, minimum: 1, maximum: 20 }
        timeLimitMin:
          type: integer
          minimum: 1
          maximum: 480
          description: Section limits together may not exceed durationMinutes (ADR 0002)
        questions:
          {
            type: array,
            minItems: 1,
            maxItems: 50,
            items: { $ref: '#/components/schemas/TestQuestionInput' },
          }
    CreateTest:
      type: object
      additionalProperties: false
      required: [name, durationMinutes, sections]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        durationMinutes: { type: integer, minimum: 5, maximum: 480 }
        profile: { $ref: '#/components/schemas/TestProfile' }
        passScore:
          {
            type: number,
            minimum: 0,
            maximum: 9999.99,
            description: From 0 to the points of all questions together,
          }
        sections:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/TestSectionInput' },
          }
    UpdateTest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        durationMinutes: { type: integer, minimum: 5, maximum: 480 }
        profile: { $ref: '#/components/schemas/TestProfile' }
        passScore: { type: number, minimum: 0, maximum: 9999.99 }
        sections:
          {
            type: array,
            minItems: 1,
            maxItems: 20,
            items: { $ref: '#/components/schemas/TestSectionInput' },
          }
    TestQuestion:
      type: object
      required: [id, position, points, questionVersionId, title, difficulty, randomRule]
      properties:
        id: { type: string }
        position: { type: integer }
        points: { type: number }
        questionVersionId: { type: string, nullable: true }
        title: { type: string, nullable: true }
        difficulty: { type: string, nullable: true, enum: [EASY, MEDIUM, HARD] }
        randomRule: { type: object, nullable: true, additionalProperties: true }
    TestSection:
      type: object
      required: [id, title, position, timeLimitMin, questions]
      properties:
        id: { type: string }
        title: { type: string }
        position: { type: integer }
        timeLimitMin: { type: integer, nullable: true }
        questions: { type: array, items: { $ref: '#/components/schemas/TestQuestion' } }
    TestSummary:
      type: object
      required:
        [
          id,
          name,
          description,
          durationMinutes,
          profile,
          passScore,
          createdById,
          createdAt,
          sectionCount,
          questionCount,
          used,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        durationMinutes: { type: integer }
        profile: { $ref: '#/components/schemas/TestProfile' }
        passScore: { type: number, nullable: true }
        createdById: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        sectionCount: { type: integer }
        questionCount: { type: integer }
        used:
          type: boolean
          description: >-
            The test has an invitation or a session, so it can no longer be
            edited.
    TestDetail:
      allOf:
        - $ref: '#/components/schemas/TestSummary'
        - type: object
          required: [sections]
          properties:
            sections: { type: array, items: { $ref: '#/components/schemas/TestSection' } }
    TestList:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/TestSummary' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    SessionStatus:
      type: string
      description: >-
        The session state machine of ADR 0002 with ERASED (D-54, ADR 0004
        section 9): the candidate's data was erased after an erasure request.
        Terminal; set only by the erasure fence.
      enum:
        [
          INVITED,
          OPENED,
          CONSENTED,
          VERIFIED,
          IN_PROGRESS,
          PAUSED,
          SUBMITTED,
          GRADED,
          UNDER_REVIEW,
          COMPLETED,
          EXPIRED,
          APPEALED,
          DECLINED,
          ERASED,
        ]
    IdentityWaiverReason:
      type: string
      enum: [REFUSED_BIOMETRIC_PROCESSING, CANNOT_COMPLETE_ID_CHECK, OTHER]
    IdentityCheckWaiver:
      type: object
      additionalProperties: false
      description: >-
        ADR 0015, owner decisions C-02 and C-19. reasonCode is required;
        reasonNote (1 to 500 characters) is required and allowed only with
        OTHER. Never put health details in it.
      required: [reasonCode]
      properties:
        reasonCode: { $ref: '#/components/schemas/IdentityWaiverReason' }
        reasonNote: { type: string, minLength: 1, maxLength: 500 }
    InvitationAccommodations:
      type: object
      additionalProperties: false
      description: Per-candidate accommodations (FR-305, ADR 0015). Only on a single
        invitation.
      properties:
        extraTimePct:
          {
            type: integer,
            minimum: 0,
            maximum: 200,
            description: Scales the total and every section limit by the same percentage,
          }
        disabledDetectors:
          type: array
          maxItems: 8
          items:
            {
              type: string,
              enum: [FACE, GAZE, OBJECT, VOICE, MULTI_MONITOR, DEVTOOLS, VIRTUAL_CAMERA, EXTENSION],
            }
        allowedAssistiveTools:
          { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 80 } }
        notes: { type: string, maxLength: 1000 }
        identityCheckWaiver: { $ref: '#/components/schemas/IdentityCheckWaiver' }
    InviteCandidate:
      type: object
      additionalProperties: false
      required: [email, name]
      properties:
        email: { type: string, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 200 }
    CreateInvitation:
      type: object
      additionalProperties: false
      required: [candidate, windowStart, windowEnd]
      properties:
        candidate: { $ref: '#/components/schemas/InviteCandidate' }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        # NOT ACCEPTED by the API yet: CreateInvitationDto has no such field and the
        # ValidationPipe forbids unknown fields (a 400). The web does not send it.
        accommodations: { $ref: '#/components/schemas/InvitationAccommodations' }
    MailOutcome:
      type: string
      enum: [queued, failed, disabled]
      description: 'What happened to the invitation email (FR-303). queued: accepted for
        delivery, not proof of delivery. failed: the mail could not be queued; the
        invitation still exists but nothing was sent. disabled: no mail provider is
        configured; nothing was sent. There is no resend route yet, and a new invite for
        the same candidate and test is a 409 until the window ends.'
    InvitationResult:
      type: object
      required: [id, testId, candidateId, status, windowStart, windowEnd, createdAt, mail]
      properties:
        id: { type: string }
        testId: { type: string }
        candidateId: { type: string }
        status: { $ref: '#/components/schemas/SessionStatus' }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        mail: { $ref: '#/components/schemas/MailOutcome' }
    StatusStep:
      type: object
      required: [status, at]
      properties:
        status: { $ref: '#/components/schemas/SessionStatus' }
        at: { type: string, format: date-time }
    CandidateInvitation:
      type: object
      required: [id, testId, testName, status, windowStart, windowEnd, history]
      properties:
        id: { type: string }
        testId: { type: string }
        testName: { type: string }
        status: { $ref: '#/components/schemas/SessionStatus' }
        windowStart: { type: string, format: date-time }
        windowEnd: { type: string, format: date-time }
        history:
          {
            type: array,
            description: 'The statuses reached so far, oldest first',
            items: { $ref: '#/components/schemas/StatusStep' },
          }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    ProblemDetails:
      # RFC 7807 problem JSON from the API's global filter (PR #26). `code` appears only on coded errors.
      type: object
      required: [type, title, status, instance, traceId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors: { type: array, items: { type: string } }
        code: { $ref: '#/components/schemas/ProblemCode' }
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items: { type: string }
    Language:
      # Must match codeLanguageSchema in packages/shared/src/code-run.ts.
      type: string
      enum: [python, javascript, java]
    DraftRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [code, mcq] }
        language: { $ref: '#/components/schemas/Language' }
        code: { type: string, maxLength: 100000 } # MAX_SOURCE_CODE_LENGTH in packages/shared
        selectedOptionId: { type: string, nullable: true }
    RunRequest:
      type: object
      required: [language, code]
      properties:
        language: { $ref: '#/components/schemas/Language' }
        code: { type: string, maxLength: 100000 } # MAX_SOURCE_CODE_LENGTH in packages/shared
    SampleTestResult:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        input: { type: string }
        expectedOutput: { type: string }
        actualOutput: { type: string }
        durationMs: { type: integer }
    RunResult:
      type: object
      required: [outcome, tests, stdout, stderr]
      properties:
        outcome:
          type: string
          enum: [completed, compile_error, runtime_error, time_limit_exceeded]
        tests:
          type: array
          items: { $ref: '#/components/schemas/SampleTestResult' }
        stdout: { type: string }
        stderr: { type: string }
    SampleTest:
      type: object
      required: [id, name, input, expectedOutput]
      properties:
        id: { type: string }
        name: { type: string }
        input: { type: string }
        expectedOutput: { type: string }
    Question:
      type: object
      required: [id, type, title, points, statementMarkdown]
      properties:
        id: { type: string }
        type: { type: string, enum: [coding, mcq] }
        title: { type: string }
        points: { type: integer }
        statementMarkdown: { type: string }
        languages:
          type: array
          items: { $ref: '#/components/schemas/Language' }
        starterCode:
          type: object
          description: Starter code keyed by language
          additionalProperties: { type: string }
        sampleTests:
          type: array
          items: { $ref: '#/components/schemas/SampleTest' }
        options:
          type: array
          items:
            type: object
            required: [id, label]
            properties:
              id: { type: string }
              label: { type: string }
    CandidateSession:
      type: object
      required: [testTitle, testDeadlineAt, section, questions]
      properties:
        testTitle: { type: string }
        testDeadlineAt: { type: string, format: date-time }
        section:
          type: object
          required: [id, position, totalSections, title, deadlineAt]
          properties:
            id: { type: string }
            position: { type: integer }
            totalSections: { type: integer }
            title: { type: string }
            deadlineAt: { type: string, format: date-time, nullable: true }
        questions:
          type: array
          description: Questions of the open section only
          items: { $ref: '#/components/schemas/Question' }
    StaffUser:
      type: object
      required: [id, email, name, role, status]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        status: { type: string, enum: [invited, active, deactivated] }
        lastLoginAt: { type: string, format: date-time, nullable: true }
    EventSeverity:
      # Must match SEVERITIES in packages/shared/src/events.ts.
      type: string
      enum: [LOW, MEDIUM, HIGH]
    RiskSettings:
      type: object
      description: FR-804 and ADR 0005 section 2. Weights are keyed by event type.
      required: [severityPoints, capPerType, bandMinScore, weights]
      properties:
        severityPoints:
          type: object
          required: [LOW, MEDIUM, HIGH]
          properties:
            LOW: { type: integer, minimum: 0, maximum: 100 }
            MEDIUM: { type: integer, minimum: 0, maximum: 100 }
            HIGH: { type: integer, minimum: 0, maximum: 100 }
        capPerType: { type: integer, minimum: 1, maximum: 20 }
        bandMinScore:
          type: object
          required: [MEDIUM, HIGH]
          properties:
            MEDIUM: { type: integer, minimum: 1, maximum: 99 }
            HIGH: { type: integer, minimum: 2, maximum: 100 }
        weights:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 5 }
    OrgSettings:
      type: object
      required: [retentionDays, erasure, risk, consentDeclineContact]
      properties:
        retentionDays: { type: integer, minimum: 7, maximum: 730 }
        erasure:
          type: object
          required: [holdWhileReviewOrAppealOpen]
          properties:
            holdWhileReviewOrAppealOpen: { type: boolean }
        risk: { $ref: '#/components/schemas/RiskSettings' }
        consentDeclineContact: { type: string, maxLength: 300 }
    OrgSettingsPatch:
      type: object
      properties:
        retentionDays: { type: integer, minimum: 7, maximum: 730 }
        erasure:
          type: object
          properties:
            holdWhileReviewOrAppealOpen: { type: boolean }
        risk: { $ref: '#/components/schemas/RiskSettings' }
        consentDeclineContact: { type: string, maxLength: 300 }
    ConsentText:
      type: object
      required: [id, version, bodyMd, createdAt, legalApprovedAt, isCurrent]
      properties:
        id: { type: string }
        version: { type: string }
        bodyMd: { type: string }
        createdAt: { type: string, format: date-time }
        legalApprovedAt: { type: string, format: date-time, nullable: true }
        legalApprovedBy: { type: string, nullable: true }
        isCurrent: { type: boolean }
    CandidateSummary:
      type: object
      required: [id, name, email, erasure]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        lastSessionAt: { type: string, format: date-time, nullable: true }
        invitationCount: { type: integer, description: 'WEB-ONLY [BE-06b]' }
        latestStatus:
          {
            allOf: [{ $ref: '#/components/schemas/SessionStatus' }],
            nullable: true,
            description: 'WEB-ONLY [BE-06b] status of the newest invitation',
          }
        erasure:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [none, waiting, queued, erased]
              description: waiting = held while a review or appeal is open (D-19)
            requestedAt: { type: string, format: date-time, nullable: true }
            waitingFor: { type: string, enum: [review, appeal], nullable: true }
    ReviewQueue:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            type: object
            required:
              - sessionId
              - candidateName
              - candidateEmail
              - testTitle
              - status
              - submittedAt
              - riskScore
              - flagCount
              - pendingManualCount
            properties:
              sessionId: { type: string }
              candidateName: { type: string }
              candidateEmail: { type: string }
              testTitle: { type: string }
              status: { $ref: '#/components/schemas/SessionStatus' }
              submittedAt: { type: string, format: date-time, nullable: true }
              riskScore: { type: number, nullable: true }
              flagCount: { type: integer }
              pendingManualCount: { type: integer }
        nextCursor: { type: string, nullable: true }
    ReviewRunResult:
      type: object
      required: [at, passed, total, tests]
      properties:
        at: { type: string, format: date-time }
        passed: { type: integer }
        total: { type: integer }
        tests:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status:
                {
                  type: string,
                  description: 'Free string. Stored verdicts are uppercase: PASSED, FAILED, TIME_LIMIT, COMPILE_ERROR, RUNTIME_ERROR, LOCAL_STUB; the API maps a missing one to PASSED, FAILED or UNKNOWN.',
                }
    ReviewAnswer:
      type: object
      required:
        [sessionQuestionId, type, title, statement, points, score, scoring, scoringNote, answer]
      properties:
        sessionQuestionId: { type: string }
        type: { type: string, enum: [CODING, MCQ, SHORT_ANSWER] }
        title: { type: string }
        statement: { type: string, description: Markdown source, shown as text }
        points: { type: number }
        score: { type: number, nullable: true }
        scoring: { type: string, enum: [AUTO, MANUAL, MANUAL_PENDING] }
        scoringNote: { type: string, nullable: true }
        answer:
          description: >-
            CODING: { language, code } or null. MCQ: the stored jsonb, written
            by the candidate flow as { optionIds: string[] } (opaque candidate
            option ids, no labels). SHORT_ANSWER: { text }. Or null. The web
            copes with any JSON value.
          nullable: true
        runResults: { type: array, items: { $ref: '#/components/schemas/ReviewRunResult' } }
    ReviewEvent:
      type: object
      required: [id, at, type, severity, detail, flagId]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        type: { type: string, description: The stored type string; may be unknown to the web }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH] }
        detail: { type: string, nullable: true }
        flagId: { type: string, nullable: true }
    ReviewRecording:
      type: object
      required: [id, kind, startedAt, durationMs]
      properties:
        id:
          {
            type: string,
            pattern: '^(SCREEN|WEBCAM|AUDIO)-\\d{1,9}$',
            description: 'KIND-SEGMENT, e.g. SCREEN-0',
          }
        kind: { type: string, enum: [SCREEN, WEBCAM, AUDIO] }
        startedAt: { type: string, format: date-time }
        durationMs: { type: integer }
    ReviewVerdict:
      type: object
      description: The session review row; all three are null until a verdict is set.
      required: [verdict, notes, completedAt]
      properties:
        verdict: { type: string, enum: [CLEAN, SUSPICIOUS, VIOLATION], nullable: true }
        notes: { type: string, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
    ReviewSession:
      type: object
      required: [session, candidate, test, answers, events, recordings, verdict]
      properties:
        session:
          type: object
          required: [id, status, startedAt, submittedAt, totalScore, riskScore]
          properties:
            id: { type: string }
            status: { $ref: '#/components/schemas/SessionStatus' }
            startedAt: { type: string, format: date-time, nullable: true }
            submittedAt: { type: string, format: date-time, nullable: true }
            totalScore: { type: number, nullable: true }
            riskScore: { type: number, nullable: true }
        candidate:
          type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string }
        test:
          type: object
          required: [title]
          properties:
            title: { type: string }
        answers: { type: array, items: { $ref: '#/components/schemas/ReviewAnswer' } }
        events: { type: array, items: { $ref: '#/components/schemas/ReviewEvent' } }
        recordings: { type: array, items: { $ref: '#/components/schemas/ReviewRecording' } }
        verdict: { allOf: [{ $ref: '#/components/schemas/ReviewVerdict' }], nullable: true }
    ReviewPlayback:
      type: object
      description: url is the first part; play parts in seq order. Never cache or store.
      required: [url, expiresAt, contentType, parts]
      properties:
        url: { type: string }
        parts:
          type: array
          items:
            type: object
            required: [url, seq, durationMs]
            properties:
              url: { type: string }
              seq: { type: integer }
              durationMs: { type: integer }
        expiresAt: { type: string, format: date-time }
        contentType: { type: string }
    ScoreAnswer:
      type: object
      required: [correct]
      properties:
        correct: { type: boolean }
        note: { type: string, minLength: 1, maxLength: 1000 }
    ScoredAnswer:
      type: object
      required: [sessionQuestionId, correct, score]
      properties:
        sessionQuestionId: { type: string }
        correct: { type: boolean }
        score: { type: number }
    SetVerdict:
      type: object
      required: [verdict]
      properties:
        verdict: { type: string, enum: [CLEAN, SUSPICIOUS, VIOLATION] }
        note: { type: string, minLength: 1, maxLength: 2000 }
