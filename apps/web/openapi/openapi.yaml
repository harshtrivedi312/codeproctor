        schema: { type: string }
    post:
      operationId: supersedeAiReference
      summary: WEB-ONLY placeholder [BE-04c]. Replace a row with a newer one; the old row keeps existing with supersededAt set (append-only, ADR 0005 AI-1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiReferenceInput' }
      responses:
        '201':
          description: The new row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiReference' }
        '400':
          description: Invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
