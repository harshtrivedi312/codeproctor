openapi: 3.0.3
info:
  title: CodeProctor API (frontend mock contract)
  version: 0.0.0-mock
  description: |
    Hand-written, minimal contract for the endpoints that apps/web calls through MSW mocks.
    There is no backend OpenAPI spec yet. When the NestJS API publishes its generated spec, replace
    this file with it, re-run `pnpm --filter @codeproctor/web gen:api`, and delete the matching
    mocks in src/mocks. Paths and shapes below are placeholders, not the final API.
servers:
  - url: http://localhost:4000
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness probe
      responses:
        '200':
          description: API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /v1/time:
    get:
      operationId: getServerTime
      summary: Server clock, used to seed client countdown timers (FR-505)
      responses:
        '200':
          description: Current server time
          content:
            application/json:
              schema:
                type: object
                required: [serverNow]
                properties:
                  serverNow: { type: string, format: date-time }
  /v1/candidate/session:
    get:
      operationId: getCandidateSession
      summary: The candidate's running session with the open section and its questions (FR-301, FR-505)
      responses:
        '200':
          description: Session snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateSession'
  /v1/candidate/questions/{questionId}/draft:
    put:
      operationId: saveDraft
      summary: Autosave a code draft or an answer (FR-504)
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRequest'
      responses:
        '200':
          description: Draft stored
          content:
            application/json:
              schema:
                type: object
                required: [savedAt]
                properties:
                  savedAt: { type: string, format: date-time }
  /v1/candidate/questions/{questionId}/run:
    post:
      operationId: runSampleTests
      summary: Run code against the sample tests (FR-502). One run per 5 seconds.
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '200':
          description: Sample test results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResult'
        '429':
          description: Too many runs
          content:
            application/json:
              schema:
                type: object
                required: [retryAfterSeconds]
                properties:
                  retryAfterSeconds: { type: integer }
  /v1/candidate/sections/{sectionId}/finish:
    post:
      operationId: finishSection
      summary: 'Finish the open section. Final, it cannot be reopened (ADR 0002 S-1).'
      parameters:
        - name: sectionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Section closed
          content:
            application/json:
              schema:
                type: object
                required: [finishedAt]
                properties:
                  finishedAt: { type: string, format: date-time }
                  nextSectionId: { type: string, nullable: true }
  /v1/auth/login:
    post:
      operationId: login
      summary: Staff password login (FR-101). Placeholder path, see fsd.md section 4 (/auth/login).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 1024 }
      responses:
        '200':
          description: Signed in, or a second step is needed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '401':
          description: >-
            Sign-in failed. One generic answer for a wrong password, an unknown email and a locked
            account (15 minutes after 5 failed attempts, FR-101); the API never reveals which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/2fa/enroll/start:
    post:
      operationId: startTwoFactorEnrollment
      summary: Begin forced TOTP enrollment (FR-102). Needs the challenge token from login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeRequest'
      responses:
        '200':
          description: Secret and otpauth URI for the QR code
          content:
            application/json:
              schema:
                type: object
                required: [manualKey, otpauthUri]
                properties:
                  manualKey: { type: string }
                  otpauthUri: { type: string }
        '401':
          description: Challenge expired, sign in again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/2fa/enroll/confirm:
    post:
      operationId: confirmTwoFactorEnrollment
      summary: Confirm enrollment with a first code; returns the one-time recovery codes (ADR 0003 section 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code: { type: string, maxLength: 6 }
      responses:
        '200':
          description: Enrolled and signed in
          content:
            application/json:
              schema:
                type: object
                required: [session, recoveryCodes]
                properties:
                  session: { $ref: '#/components/schemas/AuthSession' }
                  recoveryCodes:
                    type: array
                    items: { type: string }
        '400':
          description: Wrong code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Challenge expired, sign in again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/2fa/setup/start:
    post:
      operationId: startTwoFactorSetup
      summary: Signed-in user begins optional TOTP set-up. Mirrors backend PR #26 (FR-102, FU-BE-39).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '200':
          description: Secret, otpauth URI and QR code (PNG data URL)
          content:
            application/json:
              schema:
                type: object
                required: [manualKey, otpauthUri, qrDataUrl]
                properties:
                  manualKey: { type: string }
                  otpauthUri: { type: string }
                  qrDataUrl: { type: string }
        '400':
          description: Missing or invalid currentPassword or totpCode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Wrong current password or locked account, one identical body with code REAUTH_FAILED. Never a session expiry (that is 401).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Two-factor was turned on concurrently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/auth/2fa/setup/confirm:
    post:
      operationId: confirmTwoFactorSetup
      summary: Confirm optional set-up with a first code; returns the one-time recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, code]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 1024 }
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        '200':
          description: Two-factor is on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '400':
          description: Wrong code, or missing or invalid body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Wrong current password or locked account, one identical body with code REAUTH_FAILED. Never a session expiry (that is 401).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Two-factor state changed concurrently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/auth/2fa/disable:
    post:
      operationId: disableTwoFactor
      summary: Turn TOTP off. Needs password and TOTP code; revokes all refresh tokens and clears the cookie (backend PR #51). Not for Super Admin and Reviewer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, totpCode]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 1024 }
                totpCode:
                  {
                    type: string,
                    minLength: 6,
                    maxLength: 6,
                    description: 6-digit TOTP code only; a recovery code is 400,
                  }
      responses:
        '204':
          description: Two-factor is off and every refresh token of the user is revoked (sign in again)
        '400':
          description: Missing or invalid currentPassword or totpCode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: REAUTH_FAILED for a wrong or locked password or a wrong or replayed code (one identical body), otherwise TWO_FACTOR_REQUIRED_FOR_ROLE for Super Admin and Reviewer (checked last)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Two-factor is not on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Temporary outage (for example the code store); no failure is counted, try again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/auth/2fa/recovery-codes/regenerate:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace all recovery codes; the old set stops working
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '200':
          description: The new codes, shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '400':
          description: Missing or invalid currentPassword or totpCode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Wrong current password or locked account, one identical body with code REAUTH_FAILED. Never a session expiry (that is 401).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Two-factor is not on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v1/auth/2fa/verify:
    post:
      operationId: verifyTwoFactor
      summary: Complete login with a 6-digit TOTP code or a recovery code (FR-102, ADR 0003 section 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: { type: string }
                code: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          description: Wrong code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Challenge expired, sign in again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh cookie and return a new access token (FR-104). Cookie is httpOnly.
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: No valid refresh cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh-token family and clear the cookie
      responses:
        '204':
          description: Signed out
  /v1/auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Request a reset link. Always 202 with the same body (FR-107, D-22).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        '202':
          description: Accepted, whether or not the account exists
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
  /v1/auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a password with a single-use reset or invite token (FR-107, ADR 0003 section 4). Never signs in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, maxLength: 256 }
                newPassword: { type: string, maxLength: 1024 }
      responses:
        '204':
          description: Password set, token consumed
        '400':
          description: Token invalid, expired or already used (one message for all three)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  # ---- Staff administration (FE-03). Placeholder paths; the real ones come from BE-03 / ARC-02. ----
  /v1/admin/users:
    get:
      operationId: listStaffUsers
      summary: Staff users of the caller's organisation (SUPER_ADMIN, FR-103)
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StaffUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: inviteStaffUser
      summary: Invite a staff user by email; they set a password from the emailed link (ADR 0003 section 4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, role]
              properties:
                email: { type: string, maxLength: 254 }
                name: { type: string, maxLength: 100 }
                role: { $ref: '#/components/schemas/StaffRole' }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffUser' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A user with this email already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/admin/users/{userId}:
    patch:
      operationId: updateStaffUser
      summary: Change a role or deactivate or reactivate a user (revokes their refresh tokens)
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/StaffRole' }
                active: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such user in this organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '409':
          description: Refused, for example deactivating yourself or the last Super Admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/admin/settings:
    get:
      operationId: getOrgSettings
      summary: Organisation settings (retention, erasure hold, risk scoring, decline contact)
      responses:
        '200':
          description: Settings, with defaults for missing keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgSettings' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      operationId: updateOrgSettings
      summary: Change some organisation settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgSettingsPatch' }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgSettings' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/consent-texts:
    get:
      operationId: listConsentTexts
      summary: Consent document versions (D-17), newest first
      responses:
        '200':
          description: Versions and whether this environment refuses unapproved texts
          content:
            application/json:
              schema:
                type: object
                required: [items, legalApprovalRequired]
                properties:
                  legalApprovalRequired:
                    type: boolean
                    description: REQUIRE_LEGAL_APPROVED_CONSENT (true in pilot and production)
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ConsentText' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createConsentText
      summary: Add a new version. It starts as a placeholder; Legal approval is recorded outside this API (Q-43).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, bodyMd]
              properties:
                version: { type: string, maxLength: 40 }
                bodyMd: { type: string, maxLength: 50000 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentText' }
        '400':
          description: Invalid input
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: This version name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/admin/consent-texts/{consentTextId}/current:
    put:
      operationId: setCurrentConsentText
      summary: Make this version the one candidates sign
      parameters:
        - name: consentTextId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Now current
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentText' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Refused because the text is not approved by Legal and approval is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /v1/admin/candidates:
    get:
      operationId: listCandidates
      summary: Candidates of the organisation with their erasure state (list view only; the full page is FE-05)
      responses:
        '200':
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CandidateSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/admin/candidates/{candidateId}/erasure:
    post:
      operationId: requestCandidateErasure
      summary: Request erasure of a candidate's data (NFR-05, D-19). Waits while a review or appeal is open if the hold is on.
      parameters:
        - name: candidateId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Accepted; the body says whether it waits
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such candidate in this organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  # ---------------------------------------------------------------------------------------------
  # Question bank (FR-201..FR-205, FE-04). Routes marked REAL mirror BE-04a (PR #146,
  # apps/api/src/questions). Routes marked WEB-ONLY have no counterpart in the API yet: they are web
  # placeholders for BE-04b (variants, prefill) and BE-04c (validate job, AI reference solutions)
  # and are listed in docs/followups/frontend.md. Readers: SUPER_ADMIN, RECRUITER, AUTHOR. Writers:
  # SUPER_ADMIN, AUTHOR. 404 is identical for missing, cross-org and (for readers without
  # question:update) unpublished questions. 409 and 422 carry detail and errors[] only, no code.
  # ---------------------------------------------------------------------------------------------
  /v1/questions:
    get:
      operationId: listQuestions
      summary: REAL. List questions (question:read). Readers without question:update see published versions only and never archived questions.
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100000, default: 1 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { name: tag, in: query, schema: { type: string } }
        - { name: difficulty, in: query, schema: { $ref: '#/components/schemas/Difficulty' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/QuestionType' } }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: One page of questions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionList' }
        '400':
          description: Invalid filter, or a page that is too deep
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createQuestion
      summary: REAL. Create a question with draft version 1 (question:create).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuestion' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionDetail' }
        '400':
          description: Validation failed (errors[] lists each problem)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The slug is taken in this organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/questions/{questionId}:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getQuestion
      summary: >-
        REAL. One question with one version (the latest by default, `version` selects another). Callers
        with question:update get the full QuestionDetail. Every other reader (Recruiter) gets
        QuestionDetailRedacted: published versions only (a draft, a never-published, a missing and
        another organization's question are the identical 404), no revision, reference solution,
        answer key or validation report, and hidden test cases as id, position, isHidden and weight
        only. A published but archived question is still readable.
      parameters:
        - { name: version, in: query, schema: { type: integer, minimum: 1, maximum: 1000000 } }
      responses:
        '200':
          description: Question
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QuestionDetail'
                  - $ref: '#/components/schemas/QuestionDetailRedacted'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question or version for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      operationId: updateQuestion
      summary: >-
        REAL. Change fields of the question (question:update). Every field is optional but at least
        one is needed. A draft is edited in place; if the latest version is published this creates
        the next version as a draft (createdNewVersion true). Test cases are NOT part of this body:
        use the test-case routes. expectedRevision (the revision as loaded) makes a concurrent
        change a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateQuestion' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionDetail' }
        '400':
          description: Validation failed, or no field sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The question is archived, or it changed since it was loaded (expectedRevision); detail only, no code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/questions/{questionId}/publish:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: publishQuestion
      summary: >-
        REAL. Publish the latest draft (question:update). 422 with errors[] while the draft is
        incomplete; for a CODING question also until a passing validation of the current revision
        exists (slice BE-04c), so coding questions cannot be published yet. 409 when there is no
        draft, the question is archived, or expectedRevision no longer matches.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: No draft to publish, the question is archived, or expectedRevision no longer matches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The draft is incomplete or not validated; errors[] says what
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/questions/{questionId}/archive:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: archiveQuestion
      summary: REAL. Soft-archive a question (question:update); hidden from lists, never deleted.
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/questions/{questionId}/unarchive:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: unarchiveQuestion
      summary: REAL. Restore an archived question (question:update).
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuestionSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/questions/{questionId}/versions/{version}/test-cases:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: addTestCase
      summary: REAL. Add a test case to a draft version of a coding question (question:update).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCaseInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '400':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question or version in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The version is published (immutable), or the question is archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Not a coding question, or too many test cases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/questions/{questionId}/versions/{version}/test-cases/{testCaseId}:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: testCaseId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateTestCase
      summary: REAL. Change a test case of a draft version (question:update).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestCasePatch' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestCase' }
        '400':
          description: Validation failed, or no field sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question, version or test case in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The version is published (immutable), or the question is archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      operationId: removeTestCase
      summary: REAL. Remove a test case from a draft version (question:update).
      responses:
        '204':
          description: Removed
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No such question, version or test case in your organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The version is published (immutable), or the question is archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  # ---- WEB-ONLY placeholders: the API has no such route yet -------------------------------------
  /v1/questions/{questionId}/variants:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: query
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getVariants
      summary: WEB-ONLY placeholder [BE-04b] (ADR 0007, explicit params per variant). Variants of a version, question:update only.
      responses:
        '200':
          description: Variants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      operationId: putVariants
      summary: WEB-ONLY placeholder [BE-04b]. Replace the variants of the latest draft version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VariantList' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantList' }
        '400':
          description: Invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The version is published (immutable), or the question is archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/questions/{questionId}/prefill:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: prefillVariantOutputs
      summary: WEB-ONLY placeholder [BE-04b/c]. Run the reference solution on a variant's inputs and PROPOSE expected outputs (ADR 0007). Nothing is stored; the author must accept the proposals.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrefillRequest' }
      responses:
        '200':
          description: One proposal per slot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrefillResponse' }
        '400':
          description: Invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/questions/{questionId}/validate:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: validateQuestion
      summary: WEB-ONLY placeholder [BE-04c] (permission question:validate). Start a validation job of the current content; the job binds to the revision it validated and stores it in the validation report.
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationJobRef' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/questions/{questionId}/validation/{jobId}:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
      - name: jobId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getValidationJob
      summary: WEB-ONLY placeholder [BE-04c]. Poll a validation job.
      responses:
        '200':
          description: Job state; the report is present when done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationJob' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/questions/{questionId}/ai-references:
    parameters:
      - name: questionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listAiReferences
      summary: WEB-ONLY placeholder [BE-04c] (ADR 0005, D-20). AI reference solutions of the question with the publish policy (Authors cannot read org settings). Similarity only, never grading.
      responses:
        '200':
          description: Rows (including superseded ones) and the policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiReferenceList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
