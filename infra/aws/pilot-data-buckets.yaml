AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CodeProctor pilot data stores, OWNER-APPLIED (never by CI): media, results, consent and backup
  buckets plus one customer-managed KMS key. Single account, us-east-1. Apply after
  github-oidc-roles.yaml. No credentials, keys or account ids live in this file.

# =============================================================================================
# Why this is a separate template
#   The deploy role of github-oidc-roles.yaml can only READ these buckets' configuration. Bucket
#   policy, Block Public Access, lifecycle, encryption, versioning and the KMS key are changed
#   only by the owner through this stack (the deploy role explicitly denies those actions).
#
# Retention values (docs/compliance/retention-schedule.md v0.3 and ADR 0004 section 9):
#   media and face images  90 days  (C-04, C-27: face images never more than 90 days; recordings
#                                    default 90, organisations may set 7..730)
#   results and reports    1 year   (C-26, R-10)
#   signed consent         3 years  (C-04, C-17, R-9)
#   database backups       14 days  (retention schedule, "Backups")
#   WAL                    14 days  (parameter; not in the schedule: matched to the backups)
#
# Lifecycle is a BACKSTOP. RetentionService in the API deletes objects on the real clocks (anchor
# plus retention_days, face clock, held reviews and appeals). Expiry by object age cannot see
# holds or per-organisation settings.
#
# Versioning is NOT enabled on any bucket: ADR 0004 section 9.2 requires RetentionService to fail
# closed when versioning has ever been on without a noncurrent-version expiry of 1 day, and the
# 14 day backup rule would be exceeded by noncurrent versions.
# =============================================================================================

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Instance role
        Parameters:
          - InstanceRoleName
      - Label:
          default: Lifecycle
        Parameters:
          - SeparateBucketsInUse
          - MediaExpiryDays
          - ResultsExpiryDays
          - ConsentExpiryDays
          - BackupRetentionDays
          - WalRetentionDays

Parameters:
  InstanceRoleName:
    Type: String
    Default: codeproctor-pilot-app
    AllowedPattern: ^codeproctor-pilot-[a-z0-9-]{1,40}$
    Description: Name of the EC2 instance role (created later) that may use the key and the buckets
  SeparateBucketsInUse:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Set to true ONLY when the API writes reports and consent PDFs to the results and consent buckets (today one S3_MEDIA_BUCKET holds everything). When false, the media, results and consent expiry rules stay disabled so nothing is deleted early
  MediaExpiryDays:
    Type: Number
    Default: 90
    MinValue: 7
    MaxValue: 730
    Description: Backstop expiry of media and face images (90 days; face images never more than 90, recordings 7 to 730 by organisation setting)
  ResultsExpiryDays:
    Type: Number
    Default: 365
    MinValue: 30
    MaxValue: 1095
    Description: Backstop expiry of results and report PDFs (1 year, R-10). A review or appeal hold can extend the real clock, so consider a margin
  ConsentExpiryDays:
    Type: Number
    Default: 1095
    MinValue: 365
    MaxValue: 1825
    Description: Backstop expiry of signed consent PDFs (3 years, R-9)
  BackupRetentionDays:
    Type: Number
    Default: 14
    MinValue: 7
    MaxValue: 30
    Description: Database dump retention (14 days, retention schedule). Longer keeps deleted data longer than the published schedule
  WalRetentionDays:
    Type: Number
    Default: 14
    MinValue: 7
    MaxValue: 30
    Description: WAL archive retention. FLAGGED - the schedule does not name WAL. Conservative default equal to the dumps; WAL older than the oldest kept dump is useless

Rules:
  RegionMustBeUsEast1:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: This stack must be created in us-east-1 (C-03)

Conditions:
  ExpireSeparateBuckets: !Equals [!Ref SeparateBucketsInUse, 'true']

Resources:
  # One customer-managed key for all four buckets. Tags Environment=pilot and Purpose=data and the alias match what the deploy role's denies expect: CI can neither use nor change it.
  PilotDataKey:
    Type: 'AWS::KMS::Key'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      Description: 'codeproctor pilot data key (media, results, consent, backups)'
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: 'OwnerAdminThroughIam'
            Effect: 'Allow'
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: 'InstanceRoleUseThroughS3'
            Effect: 'Allow'
            Principal:
              AWS: '*'
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey*'
              - 'kms:DescribeKey'
            Resource: '*'
            Condition:
              StringEquals:
                kms:CallerAccount: !Sub '${AWS::AccountId}'
                kms:ViaService: !Sub 's3.${AWS::Region}.amazonaws.com'
              ArnEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}'
          - Sid: 'DenyUseToOtherCodeproctorRoles'
            Effect: 'Deny'
            Principal:
              AWS: '*'
            Action:
              - 'kms:Decrypt'
              - 'kms:Encrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:CreateGrant'
            Resource: '*'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
              ArnNotEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}'
          - Sid: 'DenyKeyAdministrationToCodeproctorRoles'
            Effect: 'Deny'
            Principal:
              AWS: '*'
            Action:
              - 'kms:PutKeyPolicy'
              - 'kms:ScheduleKeyDeletion'
              - 'kms:DisableKey*'
              - 'kms:EnableKey*'
              - 'kms:CreateGrant'
              - 'kms:RevokeGrant'
              - 'kms:RetireGrant'
              - 'kms:TagResource'
              - 'kms:UntagResource'
              - 'kms:UpdateKeyDescription'
              - 'kms:ImportKeyMaterial'
              - 'kms:DeleteImportedKeyMaterial'
            Resource: '*'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
      Tags:
        - Key: 'Environment'
          Value: 'pilot'
        - Key: 'ManagedBy'
          Value: 'codeproctor-pilot-data-buckets'
        - Key: 'Purpose'
          Value: 'data'
  PilotDataKeyAlias:
    Type: 'AWS::KMS::Alias'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      AliasName: 'alias/codeproctor-pilot-data'
      TargetKeyId: !Ref PilotDataKey
  # Media: recordings, room scans, ID images, selfies, evidence (ADR 0013 5.7 keys under orgs/<org>/sessions/). 90 days.
  MediaBucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      BucketName: !Sub 'codeproctor-pilot-media-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt PilotDataKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: 'BucketOwnerEnforced'
      LifecycleConfiguration:
        Rules:
          - Id: 'abort-incomplete-multipart'
            Status: 'Enabled'
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: 'expire-media'
            Status: !If [ExpireSeparateBuckets, Enabled, Disabled]
            ExpirationInDays: !Ref MediaExpiryDays
      Tags:
        - Key: 'Environment'
          Value: 'pilot'
        - Key: 'ManagedBy'
          Value: 'codeproctor-pilot-data-buckets'
        - Key: 'Purpose'
          Value: 'media'
  MediaBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'DenyInsecureTransport'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-media-${AWS::AccountId}'
              - !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-media-${AWS::AccountId}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: 'DenyOtherEncryptionAlgorithm'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-media-${AWS::AccountId}/*'
            Condition:
              StringNotEqualsIfExists:
                s3:x-amz-server-side-encryption: 'aws:kms'
          - Sid: 'DenyObjectAccessExceptInstanceRole'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:GetObject*'
              - 's3:PutObject*'
              - 's3:DeleteObject*'
              - 's3:RestoreObject'
              - 's3:AbortMultipartUpload'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-media-${AWS::AccountId}/*'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
              ArnNotEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}'
          - Sid: 'DenyConfigChangeFromCodeproctorRoles'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:PutBucket*'
              - 's3:DeleteBucket*'
              - 's3:PutEncryptionConfiguration'
              - 's3:PutLifecycleConfiguration'
              - 's3:PutReplicationConfiguration'
              - 's3:PutAccelerateConfiguration'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-media-${AWS::AccountId}'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
  # Results: report PDFs. 1 year.
  ResultsBucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      BucketName: !Sub 'codeproctor-pilot-results-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt PilotDataKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: 'BucketOwnerEnforced'
      LifecycleConfiguration:
        Rules:
          - Id: 'abort-incomplete-multipart'
            Status: 'Enabled'
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: 'expire-results'
            Status: !If [ExpireSeparateBuckets, Enabled, Disabled]
            ExpirationInDays: !Ref ResultsExpiryDays
      Tags:
        - Key: 'Environment'
          Value: 'pilot'
        - Key: 'ManagedBy'
          Value: 'codeproctor-pilot-data-buckets'
        - Key: 'Purpose'
          Value: 'results'
  ResultsBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref ResultsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'DenyInsecureTransport'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-results-${AWS::AccountId}'
              - !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-results-${AWS::AccountId}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: 'DenyOtherEncryptionAlgorithm'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-results-${AWS::AccountId}/*'
            Condition:
              StringNotEqualsIfExists:
                s3:x-amz-server-side-encryption: 'aws:kms'
          - Sid: 'DenyObjectAccessExceptInstanceRole'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:GetObject*'
              - 's3:PutObject*'
              - 's3:DeleteObject*'
              - 's3:RestoreObject'
              - 's3:AbortMultipartUpload'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-results-${AWS::AccountId}/*'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
              ArnNotEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}'
          - Sid: 'DenyConfigChangeFromCodeproctorRoles'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:PutBucket*'
              - 's3:DeleteBucket*'
              - 's3:PutEncryptionConfiguration'
              - 's3:PutLifecycleConfiguration'
              - 's3:PutReplicationConfiguration'
              - 's3:PutAccelerateConfiguration'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-results-${AWS::AccountId}'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
  # Consent: signed consent PDFs (orgs/<org>/consents/). 3 years.
  ConsentBucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      BucketName: !Sub 'codeproctor-pilot-consent-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt PilotDataKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: 'BucketOwnerEnforced'
      LifecycleConfiguration:
        Rules:
          - Id: 'abort-incomplete-multipart'
            Status: 'Enabled'
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: 'expire-consent'
            Status: !If [ExpireSeparateBuckets, Enabled, Disabled]
            ExpirationInDays: !Ref ConsentExpiryDays
      Tags:
        - Key: 'Environment'
          Value: 'pilot'
        - Key: 'ManagedBy'
          Value: 'codeproctor-pilot-data-buckets'
        - Key: 'Purpose'
          Value: 'consent'
  ConsentBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref ConsentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'DenyInsecureTransport'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-consent-${AWS::AccountId}'
              - !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-consent-${AWS::AccountId}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: 'DenyOtherEncryptionAlgorithm'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-consent-${AWS::AccountId}/*'
            Condition:
              StringNotEqualsIfExists:
                s3:x-amz-server-side-encryption: 'aws:kms'
          - Sid: 'DenyObjectAccessExceptInstanceRole'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:GetObject*'
              - 's3:PutObject*'
              - 's3:DeleteObject*'
              - 's3:RestoreObject'
              - 's3:AbortMultipartUpload'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-consent-${AWS::AccountId}/*'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
              ArnNotEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}'
          - Sid: 'DenyConfigChangeFromCodeproctorRoles'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:PutBucket*'
              - 's3:DeleteBucket*'
              - 's3:PutEncryptionConfiguration'
              - 's3:PutLifecycleConfiguration'
              - 's3:PutReplicationConfiguration'
              - 's3:PutAccelerateConfiguration'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-consent-${AWS::AccountId}'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
  # Backups: nightly dumps (infra/backup/backup.sh, prefix db/dumps/) and WAL archive (prefix db/wal/).
  BackupBucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      BucketName: !Sub 'codeproctor-pilot-backup-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt PilotDataKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: 'BucketOwnerEnforced'
      LifecycleConfiguration:
        Rules:
          - Id: 'abort-incomplete-multipart'
            Status: 'Enabled'
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: 'expire-dumps'
            Status: 'Enabled'
            Prefix: 'db/dumps/'
            ExpirationInDays: !Ref BackupRetentionDays
          - Id: 'expire-wal'
            Status: 'Enabled'
            Prefix: 'db/wal/'
            ExpirationInDays: !Ref WalRetentionDays
      Tags:
        - Key: 'Environment'
          Value: 'pilot'
        - Key: 'ManagedBy'
          Value: 'codeproctor-pilot-data-buckets'
        - Key: 'Purpose'
          Value: 'backup'
  BackupBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'DenyInsecureTransport'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-backup-${AWS::AccountId}'
              - !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-backup-${AWS::AccountId}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: 'DenyOtherEncryptionAlgorithm'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-backup-${AWS::AccountId}/*'
            Condition:
              StringNotEqualsIfExists:
                s3:x-amz-server-side-encryption: 'aws:kms'
          - Sid: 'DenyObjectAccessExceptInstanceRole'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:GetObject*'
              - 's3:PutObject*'
              - 's3:DeleteObject*'
              - 's3:RestoreObject'
              - 's3:AbortMultipartUpload'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-backup-${AWS::AccountId}/*'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
              ArnNotEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}'
          - Sid: 'DenyConfigChangeFromCodeproctorRoles'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:PutBucket*'
              - 's3:DeleteBucket*'
              - 's3:PutEncryptionConfiguration'
              - 's3:PutLifecycleConfiguration'
              - 's3:PutReplicationConfiguration'
              - 's3:PutAccelerateConfiguration'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-backup-${AWS::AccountId}'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'

Outputs:
  MediaBucketName:
    Description: 'S3_MEDIA_BUCKET'
    Value: !Ref MediaBucket
  ResultsBucketName:
    Description: 'Results bucket (needs an API change to be used)'
    Value: !Ref ResultsBucket
  ConsentBucketName:
    Description: 'Consent bucket (needs an API change to be used)'
    Value: !Ref ConsentBucket
  BackupBucketName:
    Description: 'S3_BACKUP_BUCKET'
    Value: !Ref BackupBucket
  DataKeyArn:
    Value: !GetAtt PilotDataKey.Arn
  DataKeyAlias:
    Value: 'alias/codeproctor-pilot-data'
