AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CodeProctor pilot data stores, OWNER-APPLIED (never by CI): media, results, consent and backup
  buckets plus one customer-managed KMS key. Single account, us-east-1. Apply after
  github-oidc-roles.yaml. No credentials, keys or account ids live in this file.

# =============================================================================================
# Why this is a separate template
#   The deploy role of github-oidc-roles.yaml can only READ these buckets' configuration. Bucket
#   policy, Block Public Access, lifecycle, encryption, versioning and the KMS key are changed
#   only by the owner through this stack (the deploy role explicitly denies those actions).
#
# Layout (DL-40): ONE media bucket (S3_MEDIA_BUCKET, ADR 0013 section 5.7 prefixes) and one backup
# bucket, both encrypted with one customer-managed key.
#
# Retention: RetentionService owns EVERY data-class clock (C-04, C-26, C-35, 3 year consent). The
# only age-based rules here are backstops that cannot be wrong:
#   media bucket   objects tagged RetentionClass=face expire 90 days after creation (C-27, C-35: face
#                  images are capped at 90 days from capture whatever any hold says). Nothing else
#                  expires by age. The API must tag them (follow-up in docs/followups/qa.md).
#   backup bucket  db/dumps/ 13 days (14 days is the schedule; S3 rounds expiry up to the next
#                  midnight UTC and deletes asynchronously, so 13 keeps objects inside 14 days)
#                  db/wal/ WalRetentionDays, default equal to the dumps (needs a physical base backup:
#                  ARC-05, not provided here; this template only provides the storage)
#                  db/erasure-list/ NEVER expires (the erasure list must outlive the dumps it re-applies to)
#
# Versioning is NOT enabled on any bucket: ADR 0004 section 9.2 requires RetentionService to fail
# closed when versioning has ever been on without a noncurrent-version expiry of 1 day.
# =============================================================================================

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Instance role
        Parameters:
          - InstanceRoleName
      - Label:
          default: Browser access
        Parameters:
          - AppOrigin
      - Label:
          default: Backup lifecycle
        Parameters:
          - BackupRetentionDays
          - WalRetentionDays

Parameters:
  InstanceRoleName:
    Type: String
    Default: codeproctor-pilot-app
    AllowedPattern: ^codeproctor-pilot-[a-z0-9-]{1,40}$
    Description: Name of the app host's instance role. It must be created with path / and exactly this name, otherwise it is locked out of its own data. The Judge0 host must use a different codeproctor-pilot-* role
  AppOrigin:
    Type: String
    AllowedPattern: ^https://[A-Za-z0-9.-]+(:[0-9]{2,5})?$
    Description: Web origin that uploads and plays media in the browser (the same value as NEXT_PUBLIC_UPLOAD_ORIGINS). No default. Used for CORS on the media bucket, which CI cannot change later
  BackupRetentionDays:
    Type: Number
    Default: 13
    MinValue: 7
    MaxValue: 14
    Description: Database dump expiry. The schedule says 14 days; 13 is the default because S3 rounds expiry to the next midnight UTC and deletes asynchronously
  WalRetentionDays:
    Type: Number
    Default: 13
    MinValue: 7
    MaxValue: 14
    Description: WAL archive expiry under db/wal/ (C-49). Keep equal to the dump retention. WAL needs a physical base backup (ARC-05) that this template does not provide

Rules:
  RegionMustBeUsEast1:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: This stack must be created in us-east-1 (C-03)

Resources:
  # One customer-managed key for all four buckets. Tags Environment=pilot and Purpose=data and the alias match what the deploy role's denies expect: CI can neither use nor change it.
  PilotDataKey:
    Type: 'AWS::KMS::Key'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      Description: 'codeproctor pilot data key (media and backups)'
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: 'OwnerAdminThroughIam'
            Effect: 'Allow'
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: 'InstanceRoleUseThroughS3'
            Effect: 'Allow'
            Principal:
              AWS: '*'
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey*'
              - 'kms:DescribeKey'
            Resource: '*'
            Condition:
              StringEquals:
                kms:CallerAccount: !Sub '${AWS::AccountId}'
                kms:ViaService: !Sub 's3.${AWS::Region}.amazonaws.com'
              ArnEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}'
          - Sid: 'DenyUseToOtherCodeproctorRoles'
            Effect: 'Deny'
            Principal:
              AWS: '*'
            Action:
              - 'kms:Decrypt'
              - 'kms:Encrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:CreateGrant'
            Resource: '*'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
              ArnNotEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}'
          - Sid: 'DenyKeyAdministrationToCodeproctorRoles'
            Effect: 'Deny'
            Principal:
              AWS: '*'
            Action:
              - 'kms:PutKeyPolicy'
              - 'kms:ScheduleKeyDeletion'
              - 'kms:DisableKey*'
              - 'kms:EnableKey*'
              - 'kms:CreateGrant'
              - 'kms:RevokeGrant'
              - 'kms:RetireGrant'
              - 'kms:TagResource'
              - 'kms:UntagResource'
              - 'kms:UpdateKeyDescription'
              - 'kms:ImportKeyMaterial'
              - 'kms:DeleteImportedKeyMaterial'
            Resource: '*'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
      Tags:
        - Key: 'Environment'
          Value: 'pilot'
        - Key: 'ManagedBy'
          Value: 'codeproctor-pilot-data-buckets'
        - Key: 'Purpose'
          Value: 'data'
  PilotDataKeyAlias:
    Type: 'AWS::KMS::Alias'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      AliasName: 'alias/codeproctor-pilot-data'
      TargetKeyId: !Ref PilotDataKey
  # Media: recordings, room scans, ID images, selfies, evidence, report PDFs and consent PDFs under orgs/<org>/... (ADR 0013 5.7). RetentionService deletes on the real clocks. Only face images (tagged RetentionClass=face) have an age backstop: 90 days (C-27, C-35).
  MediaBucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      BucketName: !Sub 'codeproctor-pilot-media-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt PilotDataKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: 'BucketOwnerEnforced'
      LifecycleConfiguration:
        Rules:
          - Id: 'abort-incomplete-multipart'
            Status: 'Enabled'
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: 'expire-face-images-90-days'
            Status: 'Enabled'
            TagFilters:
              - Key: 'RetentionClass'
                Value: 'face'
            ExpirationInDays: 90
      Tags:
        - Key: 'Environment'
          Value: 'pilot'
        - Key: 'ManagedBy'
          Value: 'codeproctor-pilot-data-buckets'
        - Key: 'Purpose'
          Value: 'media'
      CorsConfiguration:
        CorsRules:
          - Id: 'browser-upload-and-playback'
            AllowedOrigins:
              - !Ref AppOrigin
            AllowedMethods:
              - 'PUT'
              - 'GET'
              - 'HEAD'
            AllowedHeaders:
              - 'Content-Type'
              - 'If-None-Match'
            ExposedHeaders:
              - 'ETag'
            MaxAge: 3600
  MediaBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'DenyInsecureTransport'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-media-${AWS::AccountId}'
              - !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-media-${AWS::AccountId}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: 'DenyOtherEncryptionAlgorithm'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-media-${AWS::AccountId}/*'
            Condition:
              'Null':
                s3:x-amz-server-side-encryption: 'false'
              StringNotEquals:
                s3:x-amz-server-side-encryption: 'aws:kms'
          - Sid: 'DenyOtherKmsKey'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-media-${AWS::AccountId}/*'
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-aws-kms-key-id: 'false'
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt PilotDataKey.Arn
          - Sid: 'DenyObjectAccessExceptInstanceRole'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:GetObject*'
              - 's3:PutObject*'
              - 's3:DeleteObject*'
              - 's3:RestoreObject'
              - 's3:AbortMultipartUpload'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-media-${AWS::AccountId}/*'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
              ArnNotEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}'
          - Sid: 'DenyListingExceptInstanceRole'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:ListBucket'
              - 's3:ListBucketVersions'
              - 's3:ListBucketMultipartUploads'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-media-${AWS::AccountId}'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
              ArnNotEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}'
          - Sid: 'DenyConfigChangeFromCodeproctorRoles'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:PutBucket*'
              - 's3:DeleteBucket*'
              - 's3:PutEncryptionConfiguration'
              - 's3:PutLifecycleConfiguration'
              - 's3:PutReplicationConfiguration'
              - 's3:PutAccelerateConfiguration'
              - 's3:PutInventoryConfiguration'
              - 's3:PutAnalyticsConfiguration'
              - 's3:PutMetricsConfiguration'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-media-${AWS::AccountId}'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
  # Backups: nightly dumps (infra/backup/backup.sh, db/dumps/), WAL (db/wal/, storage only) and the erasure list (db/erasure-list/, never expires). backup.sh keeps its newest-dump guard: do not rely on lifecycle to keep the last dump (see README).
  BackupBucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      BucketName: !Sub 'codeproctor-pilot-backup-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt PilotDataKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: 'BucketOwnerEnforced'
      LifecycleConfiguration:
        Rules:
          - Id: 'abort-incomplete-multipart'
            Status: 'Enabled'
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: 'expire-dumps'
            Status: 'Enabled'
            Prefix: 'db/dumps/'
            ExpirationInDays: !Ref BackupRetentionDays
          - Id: 'expire-wal'
            Status: 'Enabled'
            Prefix: 'db/wal/'
            ExpirationInDays: !Ref WalRetentionDays
      Tags:
        - Key: 'Environment'
          Value: 'pilot'
        - Key: 'ManagedBy'
          Value: 'codeproctor-pilot-data-buckets'
        - Key: 'Purpose'
          Value: 'backup'
  BackupBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'DenyInsecureTransport'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-backup-${AWS::AccountId}'
              - !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-backup-${AWS::AccountId}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: 'DenyOtherEncryptionAlgorithm'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-backup-${AWS::AccountId}/*'
            Condition:
              'Null':
                s3:x-amz-server-side-encryption: 'false'
              StringNotEquals:
                s3:x-amz-server-side-encryption: 'aws:kms'
          - Sid: 'DenyOtherKmsKey'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-backup-${AWS::AccountId}/*'
            Condition:
              'Null':
                s3:x-amz-server-side-encryption-aws-kms-key-id: 'false'
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt PilotDataKey.Arn
          - Sid: 'DenyObjectAccessExceptInstanceRole'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:GetObject*'
              - 's3:PutObject*'
              - 's3:DeleteObject*'
              - 's3:RestoreObject'
              - 's3:AbortMultipartUpload'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-backup-${AWS::AccountId}/*'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
              ArnNotEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}'
          - Sid: 'DenyListingExceptInstanceRole'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:ListBucket'
              - 's3:ListBucketVersions'
              - 's3:ListBucketMultipartUploads'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-backup-${AWS::AccountId}'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'
              ArnNotEquals:
                aws:PrincipalArn: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${InstanceRoleName}'
          - Sid: 'DenyConfigChangeFromCodeproctorRoles'
            Effect: 'Deny'
            Principal: '*'
            Action:
              - 's3:PutBucket*'
              - 's3:DeleteBucket*'
              - 's3:PutEncryptionConfiguration'
              - 's3:PutLifecycleConfiguration'
              - 's3:PutReplicationConfiguration'
              - 's3:PutAccelerateConfiguration'
              - 's3:PutInventoryConfiguration'
              - 's3:PutAnalyticsConfiguration'
              - 's3:PutMetricsConfiguration'
            Resource: !Sub 'arn:${AWS::Partition}:s3:::codeproctor-pilot-backup-${AWS::AccountId}'
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/codeproctor-guardrails/*'

Outputs:
  MediaBucketName:
    Description: 'S3_MEDIA_BUCKET'
    Value: !Ref MediaBucket
  BackupBucketName:
    Description: 'S3_BACKUP_BUCKET'
    Value: !Ref BackupBucket
  DataKeyArn:
    Value: !GetAtt PilotDataKey.Arn
  DataKeyAlias:
    Value: 'alias/codeproctor-pilot-data'
