# Baseline CI (PA-01, approved by D-25). Uses only GitHub's official actions, each pinned to a
# full commit SHA with its version in a comment, and no repository secrets, so it is safe to run
# on pull requests from forks. Node 24 (from .nvmrc) is the authoritative runtime for these checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Install, build, lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node version comes from .nvmrc. Node 24 bundles corepack.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # The pnpm store is cached below, after corepack is enabled.
          package-manager-cache: false

      # pnpm version (and its integrity hash) comes from the packageManager field in package.json.
      # This runs after setup-node so the shim lands next to the Node that setup-node installed.
      - name: Enable pnpm through corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      # apps/worker builds with python3.12 (see apps/worker/package.json).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma 7 never generates the client by itself (ADR 0009 section 4.3), and the generated
      # client in apps/api/src/generated is git-ignored. Build, lint and typecheck need it.
      # Needs no database.
      - name: Generate the Prisma client
        run: pnpm db:generate

      # The variable's name is built from two pieces so this file does not contain it.
      # git grep exits 1 when nothing matches (pass), 0 on a match (fail) and 2 or more on an error.
      - name: Check Prisma's AI-consent variable appears only where ADR 0009 allows
        run: |
          name="PRISMA_USER_CONSENT_FOR_""DANGEROUS_AI_ACTION"
          status=0
          git grep -n -e "$name" -- . ':!docs' ':!infra/scripts/db-reset' ':!infra/scripts/local-db-guard.mjs' ':!prisma.config.ts' || status=$?
          case "$status" in
            1) echo "The consent variable appears only where ADR 0009 allows." ;;
            0)
              echo "Prisma's consent variable must not appear here (ADR 0009 section 4.4)." >&2
              exit 1
              ;;
            *)
              echo "git grep failed with exit status $status." >&2
              exit 1
              ;;
          esac

      # Fails if prisma.config.ts has a syntax error or throws when loaded (for example a .env
      # that defines the consent variable). `prisma version` needs no schema and no database.
      - name: Load prisma.config.ts
        run: pnpm exec prisma version

      - name: Shellcheck the reset scripts
        run: shellcheck infra/scripts/db-reset infra/scripts/dev-infra-reset

      - name: Validate the compose file
        run: docker compose -f infra/docker-compose.yml config -q

      - name: Check formatting
        run: pnpm format:check

      # Build first: packages that depend on each other type-check against the built output.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The backup restore drill (infra/scripts/verify-backup.test.mjs) needs docker, the postgres:16
      # image, the PostgreSQL 16 client and the aws CLI. REQUIRE_DB_DRILL=1 makes a missing tool fail
      # the test instead of skipping it.
      - name: Prepare the backup restore drill
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          docker pull -q postgres:16

      - name: Test
        env:
          REQUIRE_DB_DRILL: '1'
        run: pnpm test
