# Nightly staging database backup and restore drill (DB-07, NFR-03, ADR 0009, D-38).
# Staging uses Cloudflare R2 with synthetic data only. The database and bucket credentials exist
# only in this repository's GitHub Actions secrets (environment "staging"), never on a developer
# machine or in an agent session. Pilot and production back up from their own servers or a
# workflow in their own environments (DEP-03), not from here.
#
# Owner actions before the first run (docs/followups/database.md FU-DBB-04, docs/runbook.md):
# restrict the "staging" environment's deployment branches to main BEFORE creating any secret, and
# add no required reviewers (they would stall the schedule).
name: Backup (staging, nightly)

on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC, off the hour on purpose
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-staging
  cancel-in-progress: false

jobs:
  backup:
    name: Back up staging, then prove the backup restores
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    # A fork cannot reach the secrets, and a branch other than main cannot dispatch this job.
    if: github.repository == 'harshtrivedi312/codeproctor' && github.ref == 'refs/heads/main'
    services:
      # Throwaway server for the restore drill. Lives only for this job.
      drill-postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: drill-only-not-a-secret
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 12
    env:
      # The dump client must match the server's major version (backup.sh checks this).
      PG_BIN_DIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails first, with the NAMES of the missing secrets (never a value), so the owner knows exactly
      # what to add under Settings > Environments > staging > Environment secrets.
      - name: Check the staging secrets are set
        env:
          STAGING_S3_BACKUP_BUCKET: ${{ secrets.STAGING_S3_BACKUP_BUCKET }}
          STAGING_S3_ENDPOINT: ${{ secrets.STAGING_S3_ENDPOINT }}
          STAGING_S3_BACKUP_ACCESS_KEY_ID: ${{ secrets.STAGING_S3_BACKUP_ACCESS_KEY_ID }}
          STAGING_S3_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.STAGING_S3_BACKUP_SECRET_ACCESS_KEY }}
          STAGING_BACKUP_PGHOST: ${{ secrets.STAGING_BACKUP_PGHOST }}
          STAGING_BACKUP_PGUSER: ${{ secrets.STAGING_BACKUP_PGUSER }}
          STAGING_BACKUP_PGPASSWORD: ${{ secrets.STAGING_BACKUP_PGPASSWORD }}
          STAGING_BACKUP_PGDATABASE: ${{ secrets.STAGING_BACKUP_PGDATABASE }}
        run: |
          missing=""
          for name in STAGING_S3_BACKUP_BUCKET STAGING_S3_ENDPOINT STAGING_S3_BACKUP_ACCESS_KEY_ID \
            STAGING_S3_BACKUP_SECRET_ACCESS_KEY STAGING_BACKUP_PGHOST STAGING_BACKUP_PGUSER \
            STAGING_BACKUP_PGPASSWORD STAGING_BACKUP_PGDATABASE; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Staging backup secrets missing::Add these secrets to the GitHub environment 'staging' (names only here, never paste values in a ticket or chat):$missing. STAGING_BACKUP_PGPORT is optional (default 5432). See docs/runbook.md, Staging database setup (DEP-01)."
            exit 1
          fi

      - name: Install the PostgreSQL 16 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16

      - name: Back up staging
        env:
          S3_BACKUP_BUCKET: ${{ secrets.STAGING_S3_BACKUP_BUCKET }}
          S3_ENDPOINT: ${{ secrets.STAGING_S3_ENDPOINT }}
          S3_REGION: auto
          S3_ACCESS_KEY_ID: ${{ secrets.STAGING_S3_BACKUP_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.STAGING_S3_BACKUP_SECRET_ACCESS_KEY }}
          BACKUP_PREFIX: staging/
          PGHOST: ${{ secrets.STAGING_BACKUP_PGHOST }}
          PGPORT: ${{ secrets.STAGING_BACKUP_PGPORT }}
          PGUSER: ${{ secrets.STAGING_BACKUP_PGUSER }}
          PGPASSWORD: ${{ secrets.STAGING_BACKUP_PGPASSWORD }}
          PGDATABASE: ${{ secrets.STAGING_BACKUP_PGDATABASE }}
          # Encrypt and verify the server certificate against the system CA store (libpq 16).
          PGSSLMODE: verify-full
          PGSSLROOTCERT: system
        run: sh infra/backup/backup.sh

      # Restore the newest backup into the throwaway server and compare row counts.
      # restore.sh exits 2 when the counts differ, which fails the job.
      - name: Restore drill
        env:
          S3_BACKUP_BUCKET: ${{ secrets.STAGING_S3_BACKUP_BUCKET }}
          S3_ENDPOINT: ${{ secrets.STAGING_S3_ENDPOINT }}
          S3_REGION: auto
          S3_ACCESS_KEY_ID: ${{ secrets.STAGING_S3_BACKUP_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.STAGING_S3_BACKUP_SECRET_ACCESS_KEY }}
          BACKUP_PREFIX: staging/
          PGHOST: 127.0.0.1
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: drill-only-not-a-secret
          RESTORE_CREATE_APP_USER: '1'
        run: sh infra/backup/restore.sh --target-db drill_restore
