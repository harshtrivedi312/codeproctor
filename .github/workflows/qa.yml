# QA-01: test suite gate. Fails when any test that names a P1 test case fails (packages/qa/src/p1-gate.ts)
# and prints coverage per module. Uses the same pinned official actions as ci.yml. The p1-gate job
# uses no secrets, so it is safe on pull requests from forks. The ZAP and k6 jobs run only on a manual
# dispatch (never on pull requests), only against hosts in the repository variable QA_STAGING_HOSTS,
# and the k6 job reads the secret K6_SESSIONS_JSON from the `staging` environment.
name: QA

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL of the environment for the ZAP baseline scan or the k6 run (staging only)'
        required: false
        type: string
      api_url:
        description: 'API origin for a second ZAP baseline scan, for example https://api.staging.example/api/v1/health (staging only, optional)'
        required: false
        type: string
      scan:
        description: 'Which dispatch job to run'
        required: false
        type: choice
        options: [none, zap-baseline, k6-load, k6-code-run]
        default: none

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  p1-gate:
    name: P1 gate (unit, e2e, a11y) and coverage per module
    if: github.event_name != 'workflow_dispatch' || inputs.scan == 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable pnpm through corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm db:generate

      # The web app is built with mocked data so Playwright can drive /t/demo/test. Remove the
      # mock build when the API contract is real (see docs/followups/qa.md).
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_MOCKING: enabled

      # Every test step runs even when an earlier one failed (`!cancelled()`), so the gate below
      # sees all reports and prints one verdict per P1 case. The job still fails if any step failed.
      - name: Create the report folder
        run: mkdir -p packages/qa/test-results

      # Vitest in apps/web, with coverage per module in the log. The JSON files feed the gate.
      - name: Unit tests and coverage per module (apps/web)
        if: ${{ !cancelled() }}
        run: pnpm --filter @codeproctor/qa run coverage:web --reporter=default --reporter=json --outputFile.json=../../packages/qa/test-results/web.json

      - name: Matrix check and QA package tests
        if: ${{ !cancelled() }}
        run: pnpm --filter @codeproctor/qa exec vitest run --reporter=default --reporter=json --outputFile.json=test-results/qa.json

      - name: Proctor SDK tests (TC-050..056, TC-063, TC-065 and the SDK suites)
        if: ${{ !cancelled() }}
        run: pnpm --filter @codeproctor/proctor-sdk exec vitest run --reporter=default --reporter=json --outputFile.json=../qa/test-results/sdk.json

      - name: Shared contract tests (node:test, JUnit report)
        if: ${{ !cancelled() }}
        run: pnpm --filter @codeproctor/shared exec node --import tsx --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=../qa/test-results/shared.xml "src/**/*.test.ts"

      - name: Worker tests (pytest, JUnit report)
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --quiet -e 'apps/worker[dev]'
          cd apps/worker && python -m pytest --junitxml=../../packages/qa/test-results/worker.xml

      # Testcontainers starts throwaway Postgres 16 and Redis from the runner's own Docker; no
      # secret and no shared database is involved (apps/api/test/support/harness.ts).
      - name: API integration tests (Testcontainers)
        if: ${{ !cancelled() }}
        run: pnpm --filter @codeproctor/api exec node --experimental-vm-modules node_modules/jest/bin/jest.js -c test/jest.integration.config.js --runInBand --forceExit --json --outputFile=../../packages/qa/test-results/api-int.json

      # The apps/api unit config also holds TC-008 (org isolation, src/database/tc-008-org-isolation.spec.ts).
      # Its JSON goes to the gate so TC-008 is read like any other P1 case.
      - name: API unit and org-isolation tests (TC-008)
        if: ${{ !cancelled() }}
        run: pnpm --filter @codeproctor/api exec node --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand --forceExit --json --outputFile=../../packages/qa/test-results/api-unit.json

      - name: Install the Playwright browser
        if: ${{ !cancelled() }}
        run: pnpm --filter @codeproctor/qa exec playwright install --with-deps chromium

      - name: End-to-end and axe tests
        if: ${{ !cancelled() }}
        run: pnpm --filter @codeproctor/qa run test:e2e

      # Fails when a test that names a P1 TC ID failed. Playwright runs above fail the job on their
      # own as well; the gate makes the P1 verdict explicit and prints one line per P1 case.
      - name: P1 gate
        if: ${{ !cancelled() }}
        run: pnpm --filter @codeproctor/qa run gate test-results/web.json test-results/qa.json test-results/sdk.json test-results/shared.xml test-results/worker.xml test-results/api-int.json test-results/api-unit.json test-results/e2e.json

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-reports
          path: |
            packages/qa/test-results
            packages/qa/playwright-report
            packages/qa/coverage
          if-no-files-found: ignore

  zap-baseline:
    name: OWASP ZAP baseline (TC-093)
    if: github.event_name == 'workflow_dispatch' && inputs.scan == 'zap-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Allow only staging hosts
        env:
          TARGET: ${{ inputs.target_url }}
          STAGING_HOSTS: ${{ vars.QA_STAGING_HOSTS }}
        run: |
          case "$TARGET" in
            https://*) ;;
            *) echo "Give an https staging URL." >&2; exit 1 ;;
          esac
          host="${TARGET#https://}"; host="${host%%[/:?#]*}"
          if [ -z "$STAGING_HOSTS" ]; then
            echo "Set the repository variable QA_STAGING_HOSTS (comma separated hostnames) first." >&2; exit 1
          fi
          case ",${STAGING_HOSTS//[[:space:]]/}," in
            *",$host,"*) echo "Target host $host is allowed." ;;
            *) echo "Host $host is not in QA_STAGING_HOSTS." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The API origin gets the same host allow-list check as the web origin.
      - name: Allow only staging hosts for the API origin
        if: ${{ inputs.api_url != '' }}
        env:
          TARGET: ${{ inputs.api_url }}
          STAGING_HOSTS: ${{ vars.QA_STAGING_HOSTS }}
        run: |
          case "$TARGET" in
            https://*) ;;
            *) echo "Give an https staging URL." >&2; exit 1 ;;
          esac
          host="${TARGET#https://}"; host="${host%%[/:?#]*}"
          case ",${STAGING_HOSTS//[[:space:]]/}," in
            *",$host,"*) echo "API host $host is allowed." ;;
            *) echo "Host $host is not in QA_STAGING_HOSTS." >&2; exit 1 ;;
          esac
      # -I keeps warnings from failing the scan; the verdict comes from evaluate.mjs below.
      - name: Run the baseline scan (web origin)
        env:
          TARGET: ${{ inputs.target_url }}
        run: |
          mkdir -p zap && chmod 777 zap
          cp packages/qa/zap/baseline.conf zap/
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py -t "$TARGET" -c baseline.conf -J report.json -r report.html -I
      - name: Run the baseline scan (API origin)
        if: ${{ inputs.api_url != '' }}
        env:
          TARGET: ${{ inputs.api_url }}
        run: |
          docker run --rm -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py -t "$TARGET" -c baseline.conf -J report-api.json -r report-api.html -I
      # TC-093: no high findings. cli.mjs exits 1 on a High alert and 2 on a missing, empty,
      # wrong-host or unreachable-target report (the old jq count passed on an empty report). It prints
      # alert names and counts, never URLs.
      - name: Fail on high findings
        env:
          WEB_TARGET: ${{ inputs.target_url }}
          API_TARGET: ${{ inputs.api_url }}
        run: |
          web_host="${WEB_TARGET#https://}"; web_host="${web_host%%[/:?#]*}"
          node packages/qa/zap/cli.mjs --target-host "$web_host" zap/report.json
          if [ -f zap/report-api.json ]; then
            api_host="${API_TARGET#https://}"; api_host="${api_host%%[/:?#]*}"
            node packages/qa/zap/cli.mjs --target-host "$api_host" zap/report-api.json
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: zap-report
          path: zap

  k6:
    name: k6 load (TC-090, TC-091)
    if: github.event_name == 'workflow_dispatch' && (inputs.scan == 'k6-load' || inputs.scan == 'k6-code-run')
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow only staging hosts
        env:
          TARGET: ${{ inputs.target_url }}
          STAGING_HOSTS: ${{ vars.QA_STAGING_HOSTS }}
        run: |
          case "$TARGET" in
            https://*) ;;
            *) echo "Give an https staging URL." >&2; exit 1 ;;
          esac
          host="${TARGET#https://}"; host="${host%%[/:?#]*}"
          if [ -z "$STAGING_HOSTS" ]; then
            echo "Set the repository variable QA_STAGING_HOSTS (comma separated hostnames) first." >&2; exit 1
          fi
          case ",${STAGING_HOSTS//[[:space:]]/}," in
            *",$host,"*) echo "Target host $host is allowed." ;;
            *) echo "Host $host is not in QA_STAGING_HOSTS." >&2; exit 1 ;;
          esac
      # The seeded load sessions come from an environment secret that holds staging-only values:
      # K6_SESSIONS_JSON, the JSON list described in packages/qa/k6/README.md. Add it before the
      # first run. It is passed to the container by name (docker -e SESSIONS_JSON, k6 reads it from its environment), so it never appears in an argument list.
      # Images are pinned by digest (the tags were latest/stable on 2026-10-02). Bump deliberately.
      - name: Run k6
        env:
          TARGET: ${{ inputs.target_url }}
          SCRIPT: ${{ inputs.scan == 'k6-load' && 'tc-090-load.js' || 'tc-091-code-run.js' }}
          SESSIONS_JSON: ${{ secrets.K6_SESSIONS_JSON }}
        run: |
          host="${TARGET#https://}"; host="${host%%[/:?#]*}"
          mkdir -p k6-out && chmod 777 k6-out
          docker run --rm -v "$PWD/packages/qa/k6:/k6:ro" -v "$PWD/k6-out:/out:rw" -w /k6 \
            -e SESSIONS_JSON \
            -e ALLOWED_HOSTS="$host" \
            grafana/k6@sha256:e66db15b860113878fa74670e31f5e274830b7b6e42c8bff28b2f2d86a257603 \
            run -e API_BASE_URL="${TARGET%/}/api/v1" \
            --summary-export=/out/summary.json "$SCRIPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: k6-summary
          path: k6-out/summary.json
          if-no-files-found: ignore
